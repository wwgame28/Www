// ---------- тайлы ----------
function tileSprite(theme, kind, v) {
  return sprite(`${theme}:${kind}:${v}`, T, T, c => {
    const top = v & 1, bot = v & 2, r = v >> 2;
    if (kind === 'crate') {
      if (theme === 'bath') {
        c.fillStyle = '#ff9ec7'; c.fillRect(0, 0, T, T);
        c.fillStyle = '#ffc3dd'; rrect(c, 2, 2, 12, 12, 3); c.fill();
        c.fillStyle = '#ffe3ef'; c.fillRect(4, 4, 5, 2);
        c.strokeStyle = '#d96a9c'; c.lineWidth = 1; c.strokeRect(0.5, 0.5, T - 1, T - 1);
      } else {
        c.fillStyle = '#c7843e'; c.fillRect(0, 0, T, T);
        c.strokeStyle = '#7a4a1d'; c.lineWidth = 2; c.strokeRect(1, 1, T - 2, T - 2);
        c.beginPath(); c.moveTo(2, 2); c.lineTo(T - 2, T - 2); c.moveTo(T - 2, 2); c.lineTo(2, T - 2); c.lineWidth = 1.5; c.stroke();
        c.fillStyle = '#e0a060'; c.fillRect(2, 2, T - 4, 1.5);
      }
      return;
    }
    if (theme === 'beach') {
      c.fillStyle = '#efc576'; c.fillRect(0, 0, T, T);
      for (let i = 0; i < 6; i++) { c.fillStyle = i % 2 ? '#dcae5e' : '#f9dc98'; c.fillRect(hash(i, r) * 14, hash(r, i + 9) * 14, 1.6, 1.6); }
      if (top) {
        c.fillStyle = '#ffe7a8'; c.beginPath(); c.moveTo(0, 0); c.lineTo(T, 0); c.lineTo(T, 4);
        for (let x = T; x >= 0; x -= 4) c.lineTo(x, 4 + ((x / 4 + r) % 2) * 1.5);
        c.fill();
        if (r === 1) { c.fillStyle = '#ff9a8a'; c.beginPath(); c.arc(9, 3, 2, Math.PI, 0); c.fill(); }
      }
    } else if (theme === 'pier') {
      c.fillStyle = '#9a6233'; c.fillRect(0, 0, T, T);
      c.fillStyle = '#6e4220'; c.fillRect(0, 7, T, 1.2); c.fillRect(0, 15, T, 1);
      c.fillRect(r * 5 + 2, 0, 1.2, 7); c.fillRect((r * 5 + 10) % T, 8, 1.2, 7);
      c.fillStyle = '#b07a46'; c.fillRect(0, 1, T, 1); c.fillRect(0, 9, T, 1);
      c.fillStyle = '#3b2412'; c.fillRect(r * 5 + 4, 3, 1.3, 1.3); c.fillRect((r * 5 + 12) % T, 11, 1.3, 1.3);
      if (top) { c.fillStyle = '#c99760'; c.fillRect(0, 0, T, 2); }
      if (bot) { c.fillStyle = 'rgba(30,15,5,.55)'; c.fillRect(0, T - 4, T, 4); }
    } else if (theme === 'bath') {
      c.fillStyle = '#b7d4e4'; c.fillRect(0, 0, T, T);
      c.fillStyle = '#f4fbff'; c.fillRect(0.6, 0.6, 6.8, 6.8); c.fillRect(8.6, 0.6, 6.8, 6.8); c.fillRect(0.6, 8.6, 6.8, 6.8); c.fillRect(8.6, 8.6, 6.8, 6.8);
      c.fillStyle = 'rgba(255,255,255,.9)'; c.fillRect(1.5, 1.5, 3, 1); c.fillRect(9.5, 9.5, 3, 1);
      if (top) { c.fillStyle = '#4fa3d9'; c.fillRect(0, 0, T, 3.5); c.fillStyle = '#bfe6ff'; c.fillRect(0, 0.6, T, 1); }
    } else {
      c.fillStyle = '#0b3b28'; c.fillRect(0, 0, T, T);
      c.fillStyle = 'rgba(120,255,180,.07)'; c.fillRect(0, 0, T, T / 2);
      if (top) { c.fillStyle = '#3fb070'; c.fillRect(0, 0, T, 2); }
    }
  });
}

function drawTiles(w, camX, camY) {
  const c = ctx;
  const x0 = Math.max(0, Math.floor(camX / T)), x1 = Math.min(w.W - 1, Math.floor((camX + VW) / T));
  const y0 = Math.max(0, Math.floor(camY / T)), y1 = Math.min(w.H - 1, Math.floor((camY + VH) / T));
  const O = 0.6;   // перекрытие, чтобы не было швов
  for (let ty = y0; ty <= y1; ty++) {
    for (let tx = x0; tx <= x1; tx++) {
      const t = w.tiles[ty * w.W + tx];
      if (t === SOL || t === CRATE) {
        let v;
        if (t === SOL) {
          const up = tileAt(tx, ty - 1), dn = tileAt(tx, ty + 1);
          v = (up !== SOL ? 1 : 0) | (dn !== SOL && ty < w.H - 1 ? 2 : 0) | (((hash(tx, ty) * 3) | 0) << 2);
        } else v = 0;
        c.drawImage(tileSprite(w.theme, t === CRATE ? 'crate' : 'g', v), tx * T, ty * T, T + O, T + O);
      } else if (t === SPR) drawSpring(w, tx, ty);
      else if (t === ROPE) drawRope(w, tx, ty);
    }
  }
}

function drawSpring(w, tx, ty) {
  const c = ctx, x = tx * T, y = ty * T;
  const a = w.springs.get(ty * w.W + tx) || 0;
  const sq = a > 0 ? Math.sin((0.4 - a) / 0.4 * Math.PI * 3) * (a / 0.4) : 0;
  c.save(); c.translate(x + 8, y + T); c.scale(1 - sq * 0.25, 1 + sq * 0.4);
  if (w.theme === 'beach') {       // ведёрко
    c.fillStyle = '#2f7fe0'; c.beginPath(); c.moveTo(-7, -14); c.lineTo(7, -14); c.lineTo(5.5, 0); c.lineTo(-5.5, 0); c.fill();
    c.fillStyle = '#5fa8ff'; c.fillRect(-7.5, -15, 15, 3);
    c.strokeStyle = '#ffd34d'; c.lineWidth = 1.2; c.beginPath(); c.arc(0, -14, 6, Math.PI, 0); c.stroke();
    c.fillStyle = '#ffd34d'; c.fillRect(-4, -9, 8, 2);
  } else if (w.theme === 'pier') { // спасательный круг
    c.lineWidth = 4.5; c.strokeStyle = '#fff'; c.beginPath(); c.ellipse(0, -5, 7, 4.5, 0, 0, 7); c.stroke();
    c.strokeStyle = '#ff3b3b'; c.setLineDash([3.5, 3.5]); c.stroke(); c.setLineDash([]);
  } else {                          // губка
    c.fillStyle = '#ffd34d'; rrect(c, -8, -11, 16, 11, 3); c.fill();
    c.fillStyle = '#7ee07a'; rrect(c, -8, -4, 16, 4, 1.5); c.fill();
    c.fillStyle = '#e8b52c'; for (let i = 0; i < 4; i++) circle(c, -5 + i * 3.4, -7 + (i % 2) * 2, 0.9, '#d9a020');
  }
  c.restore();
}

function drawRope(w, tx, ty) {
  const c = ctx, x = tx * T + 8, y = ty * T;
  const chain = w.theme === 'bath';
  if (chain) {
    c.strokeStyle = '#9aa8b4'; c.lineWidth = 1.4;
    for (let i = 0; i < 4; i++) { c.beginPath(); c.ellipse(x, y + 2 + i * 4, i % 2 ? 1.2 : 2.2, 2.4, 0, 0, 7); c.stroke(); }
  } else {
    c.fillStyle = '#c9974d'; c.fillRect(x - 2, y, 4, T);
    c.strokeStyle = '#8a5f28'; c.lineWidth = 1;
    c.beginPath(); for (let i = 0; i < 4; i++) { c.moveTo(x - 2, y + i * 4); c.lineTo(x + 2, y + i * 4 + 3); } c.stroke();
  }
  if (tileAt(tx, ty - 1) !== ROPE) { c.fillStyle = chain ? '#9aa8b4' : '#8a5f28'; circle(c, x, y + 1, 3); c.fill(); }
  if (tileAt(tx, ty + 1) !== ROPE && !chain) { c.fillStyle = '#c9974d'; circle(c, x, y + T - 1, 2.6); c.fill(); }
  if (tileAt(tx, ty + 1) !== ROPE && chain) { c.fillStyle = '#2a3440'; rrect(c, x - 5, y + T - 4, 10, 6, 2); c.fill(); }
}

const UMB = [['#ff4d5a', '#fff'], ['#2f8fff', '#fff'], ['#ffc12f', '#ff5fa2']];
function drawRuns(w, camX) {
  const c = ctx;
  for (const r of w.runs) {
    const x0 = r.x0 * T, x1 = r.x1 * T, y = r.y * T;
    if (x1 < camX - 40 || x0 > camX + VW + 40) continue;
    const th = w.theme;
    if (r.ch === '=' && th === 'beach') {
      const mid = (x0 + x1) / 2, [a, b] = UMB[r.col];
      c.fillStyle = '#e8e8e8'; c.fillRect(mid - 1.5, y + 6, 3, r.ground - y - 6);
      c.fillStyle = '#b0b0b0'; c.fillRect(mid - 0.5, y + 6, 1, r.ground - y - 6);
      c.save();
      c.beginPath(); c.moveTo(x0 - 5, y + 9); c.quadraticCurveTo(mid, y - 8, x1 + 5, y + 9);
      const n = Math.max(4, (r.x1 - r.x0) * 2);
      for (let i = n; i >= 0; i--) { const xx = x0 - 5 + (x1 - x0 + 10) * i / n; c.lineTo(xx, y + 9); if (i) c.quadraticCurveTo(xx - (x1 - x0 + 10) / n / 2, y + 12, xx - (x1 - x0 + 10) / n, y + 9); }
      c.closePath(); c.fillStyle = a; c.fill(); c.clip();
      c.fillStyle = b;
      for (let i = 0; i < n; i += 2) { const xa = x0 - 5 + (x1 - x0 + 10) * i / n; c.beginPath(); c.moveTo(mid, y - 6); c.lineTo(xa, y + 14); c.lineTo(xa + (x1 - x0 + 10) / n, y + 14); c.fill(); }
      c.restore();
      c.fillStyle = 'rgba(255,255,255,.35)'; c.beginPath(); c.ellipse(mid - (x1 - x0) * 0.2, y + 1, (x1 - x0) * 0.18, 2, -0.2, 0, 7); c.fill();
      circle(c, mid, y - 1, 2, '#ddd');
    } else if (r.ch === '_' && th === 'beach') {
      c.fillStyle = '#e9e1d0';
      for (const [lx, g] of [[x0 + 3, r.gl], [x1 - 5, r.gr]]) c.fillRect(lx, y + 4, 2.5, g - y - 4);
      c.strokeStyle = '#d5c8ad'; c.lineWidth = 1.2;
      c.beginPath(); c.moveTo(x0 + 4, y + 8); c.lineTo(x1 - 4, Math.min(r.gr, y + 60)); c.moveTo(x1 - 4, y + 8); c.lineTo(x0 + 4, Math.min(r.gl, y + 60)); c.stroke();
      c.fillStyle = '#fff'; c.fillRect(x0, y, x1 - x0, 5);
      c.fillStyle = '#ff4d5a'; for (let x = x0; x < x1; x += 8) c.fillRect(x, y, 4, 5);
      c.fillStyle = '#c8b89a'; c.fillRect(x0, y + 5, x1 - x0, 1.5);
      c.fillStyle = '#fff'; c.fillRect(x0, y - 10, 2, 10); c.fillRect(x1 - 2, y - 10, 2, 10); c.fillRect(x0, y - 10, x1 - x0, 2);
    } else if (th === 'pier' || (r.ch === '_' && th !== 'bath')) {
      const long = r.gl - y < 140;
      if (long) { c.fillStyle = '#5a3a1e'; c.fillRect(x0 + 2, y + 5, 3, r.gl - y - 5); c.fillRect(x1 - 5, y + 5, 3, r.gr - y - 5); }
      else { c.fillStyle = '#6e4a26'; c.fillRect((x0 + x1) / 2 - 2, y + 5, 4, Math.min(r.ground, w.H * T) - y - 5); }
      c.fillStyle = '#a8703c'; rrect(c, x0, y, x1 - x0, 6, 2); c.fill();
      c.fillStyle = '#c99760'; c.fillRect(x0 + 1, y + 0.5, x1 - x0 - 2, 1.5);
      c.fillStyle = '#5a3a1e'; for (let x = x0 + 4; x < x1; x += 8) c.fillRect(x, y + 2.5, 1.2, 1.2);
    } else if (th === 'bath') {     // мыльница
      c.fillStyle = '#ffffff'; rrect(c, x0 - 2, y, x1 - x0 + 4, 4, 2); c.fill();
      c.fillStyle = '#ff8fc0'; c.beginPath(); c.moveTo(x0 - 2, y + 3); c.lineTo(x1 + 2, y + 3); c.quadraticCurveTo(x1, y + 12, (x0 + x1) / 2, y + 12); c.quadraticCurveTo(x0, y + 12, x0 - 2, y + 3); c.fill();
      c.fillStyle = 'rgba(255,255,255,.45)'; c.fillRect(x0 + 3, y + 5, (x1 - x0) * 0.4, 1.5);
      for (let x = x0 + 5; x < x1 - 2; x += 7) { c.strokeStyle = 'rgba(255,255,255,.8)'; c.lineWidth = 0.8; circle(c, x, y - 2, 1.6); c.stroke(); }
    } else {                         // стеклянный выступ в бутылке
      c.fillStyle = '#5fd39a'; rrect(c, x0, y, x1 - x0, 5, 2.5); c.fill();
      c.fillStyle = 'rgba(255,255,255,.5)'; c.fillRect(x0 + 2, y + 1, x1 - x0 - 4, 1);
    }
  }
}

function drawPiles(w, camX) {
  const c = ctx;
  for (const p of w.piles) {
    const x = p.x * T + 4;
    if (x < camX - 20 || x > camX + VW + 20) continue;
    c.fillStyle = '#4a2f18'; c.fillRect(x, p.y0 * T, 8, (p.y1 - p.y0) * T + 8);
    c.fillStyle = '#6b4526'; c.fillRect(x + 1.5, p.y0 * T, 2, (p.y1 - p.y0) * T + 8);
    c.fillStyle = '#2f1d0e'; for (let y = p.y0 * T + 10; y < p.y1 * T; y += 22) c.fillRect(x - 1, y, 10, 2);
    c.fillStyle = 'rgba(80,200,120,.6)'; c.fillRect(x, p.y1 * T - 6, 8, 6);
  }
}

function drawDecor(w, camX) {
  const c = ctx;
  for (const d of w.decor) {
    if (d.x < camX - 80 || d.x > camX + VW + 80) continue;
    if (d.ch === 'T') palm(c, d.x - 4, d.y, 78, '#9b7046', '#2fae5a');
    else if (d.ch === 'L') {
      c.fillStyle = '#2a2a3a'; c.fillRect(d.x - 1.5, d.y - 46, 3, 46); c.fillRect(d.x - 5, d.y - 3, 10, 3);
      c.fillStyle = 'rgba(255,220,120,.25)'; circle(c, d.x, d.y - 50, 14 + Math.sin(w.t * 3) * 1.5); c.fill();
      c.fillStyle = '#ffe08a'; rrect(c, d.x - 4, d.y - 56, 8, 10, 2); c.fill();
      c.fillStyle = '#2a2a3a'; c.fillRect(d.x - 5, d.y - 58, 10, 2.5);
    } else if (d.ch === 'F') {
      // огромный кран
      const x = d.x, y = d.y;
      c.fillStyle = grad('chrome', () => { const g = ctx.createLinearGradient(0, -20, 0, 20); g.addColorStop(0, '#ffffff'); g.addColorStop(0.5, '#a9b8c6'); g.addColorStop(1, '#6d7f90'); return g; });
      c.save(); c.translate(x, y);
      rrect(c, -30, -46, 60, 16, 6); c.fill();
      rrect(c, -8, -60, 16, 18, 4); c.fill();
      rrect(c, 14, -42, 22, 34, 8); c.fill();
      rrect(c, -40, -56, 22, 8, 4); c.fill(); rrect(c, 18, -56, 22, 8, 4); c.fill();
      c.fillStyle = '#ff5f6f'; circle(c, -29, -52, 3); c.fill(); c.fillStyle = '#4fa3ff'; circle(c, 29, -52, 3); c.fill();
      c.restore();
      const k = (w.t * 0.8) % 1;
      c.fillStyle = 'rgba(140,210,255,.9)'; c.beginPath(); c.ellipse(x + 25, y - 6 + k * 70, 2.5, 3.5, 0, 0, 7); c.fill();
    }
  }
}

function drawWater(w, camX, camY) {
  const c = ctx, th = w.theme;
  const col = th === 'pier' ? 'rgba(24,82,140,.86)' : th === 'bath' ? 'rgba(140,215,255,.72)' : 'rgba(30,170,215,.82)';
  const foam = th === 'bath' ? '#ffffff' : 'rgba(255,255,255,.85)';
  for (const r of w.water) {
    const x0 = r.x0 * T, x1 = r.x1 * T, y = r.y * T;
    if (x1 < camX || x0 > camX + VW || y > camY + VH || y + T < camY) continue;
    c.fillStyle = col;
    if (!r.top) { c.fillRect(x0, y, x1 - x0, T + 0.5); continue; }
    c.beginPath(); c.moveTo(x0, y + T + 0.5);
    for (let x = x0; x <= x1; x += 4) c.lineTo(x, y + 3 + Math.sin(x * 0.12 + w.t * 3) * 1.6);
    c.lineTo(x1, y + T + 0.5); c.fill();
    c.strokeStyle = foam; c.lineWidth = 1.6; c.beginPath();
    for (let x = x0; x <= x1; x += 4) { const yy = y + 3 + Math.sin(x * 0.12 + w.t * 3) * 1.6; x === x0 ? c.moveTo(x, yy) : c.lineTo(x, yy); }
    c.stroke();
    if (th === 'bath') {
      c.fillStyle = 'rgba(255,255,255,.9)';
      for (let x = x0 + 6; x < x1; x += 13) circle(c, x + Math.sin(x + w.t) * 2, y + 2 + Math.sin(x * 0.3 + w.t * 2), 2 + (x % 3)), c.fill();
    } else {
      c.fillStyle = 'rgba(255,255,255,.35)';
      for (let x = x0 + 10; x < x1; x += 37) c.fillRect(x + Math.sin(w.t + x) * 5, y + 8, 8, 1.2);
    }
  }
}

// ---------- искры, предметы ----------
function drawSparks(w, camX, camY) {
  const c = ctx;
  const sp = sprite('spark', 24, 24, g => {
    const rg = g.createRadialGradient(12, 12, 0, 12, 12, 12);
    rg.addColorStop(0, 'rgba(255,255,255,1)'); rg.addColorStop(0.25, 'rgba(255,245,170,1)');
    rg.addColorStop(0.5, 'rgba(255,215,80,.55)'); rg.addColorStop(1, 'rgba(255,200,60,0)');
    g.fillStyle = rg; g.fillRect(0, 0, 24, 24);
  });
  for (const s of w.sparks) {
    if (s.taken || s.x < camX - 20 || s.x > camX + VW + 20 || s.y < camY - 20 || s.y > camY + VH + 20) continue;
    const k = 1 + Math.sin(w.t * 5 + s.ph) * 0.15, bob = Math.sin(w.t * 2.5 + s.ph) * 1.5;
    c.drawImage(sp, s.x - 12 * k, s.y - 12 * k + bob, 24 * k, 24 * k);
    c.fillStyle = '#fff'; c.save(); c.translate(s.x, s.y + bob); c.rotate(w.t * 2 + s.ph);
    c.fillRect(-0.6, -6 * k, 1.2, 12 * k); c.fillRect(-6 * k, -0.6, 12 * k, 1.2); c.restore();
  }
}

function drawItems(w) {
  const c = ctx;
  for (const it of w.items) {
    if (it.taken) continue;
    const y = it.y + Math.sin(w.t * 3 + it.x) * 2;
    c.save(); c.translate(it.x, y); c.rotate(Math.sin(w.t * 2) * 0.1);
    c.fillStyle = 'rgba(255,200,80,.3)'; circle(c, 0, 0, 12); c.fill();
    c.fillStyle = 'rgba(180,240,255,.85)'; rrect(c, -4.5, -3, 9, 13, 3); c.fill();
    c.fillRect(-2, -8, 4, 6);
    c.fillStyle = '#ff8a1f'; rrect(c, -4, 0, 8, 9.5, 2.5); c.fill();
    c.fillStyle = '#ff3b3b'; c.fillRect(-2.6, -10, 5.2, 2.5);
    c.fillStyle = '#fff'; c.fillRect(-4, 3, 8, 3); c.fillStyle = '#ff3b3b'; c.fillRect(-1.5, 3.6, 3, 1.8);
    c.fillStyle = 'rgba(255,255,255,.8)'; c.fillRect(-3, -2, 1.2, 9);
    c.restore();
  }
  for (const k of w.checks) {
    const x = k.x, y = k.y;
    c.fillStyle = '#e8e8e8'; c.fillRect(x - 1, y - 34, 2.5, 34);
    circle(c, x + 0.2, y - 35, 2.2, '#ffd34d');
    const wave = Math.sin(k.t * 6) * 2;
    c.fillStyle = k.active ? '#33d16f' : '#9aa3b5';
    c.beginPath(); c.moveTo(x + 1.5, y - 33); c.quadraticCurveTo(x + 9, y - 33 + wave, x + 16, y - 29 + wave * 0.5);
    c.quadraticCurveTo(x + 9, y - 25 + wave, x + 1.5, y - 23); c.fill();
    if (k.active) { c.fillStyle = '#fff'; circle(c, x + 7, y - 28, 1.6); c.fill(); }
  }
}

function drawCage(w) {
  const c = ctx, g = w.cage;
  if (!g) return;
  const sx = g.shake > 0 ? Math.sin(g.shake * 60) * 2 : 0;
  const x = g.x + sx, y = g.y, cw = g.w, ch = g.h;
  const f = w.friend;
  if (!g.open) drawFriend(c, x + cw / 2, y + ch - 12, w.t, true, -1);
  c.fillStyle = '#8a5a2a'; rrect(c, x - 2, y + ch - 4, cw + 4, 5, 2); c.fill();
  if (!g.open) {
    c.strokeStyle = '#ffcf3d'; c.lineWidth = 1.6;
    for (let i = 0; i <= 6; i++) { const xx = x + 2 + (cw - 4) * i / 6; c.beginPath(); c.moveTo(xx, y + ch - 4); c.lineTo(xx, y + 10); c.stroke(); }
    c.beginPath(); c.moveTo(x + 2, y + 10); c.quadraticCurveTo(x + cw / 2, y - 6, x + cw - 2, y + 10); c.stroke();
    c.beginPath(); c.moveTo(x + 2, y + 10); c.lineTo(x + cw - 2, y + 10); c.stroke();
    c.beginPath(); c.arc(x + cw / 2, y - 1, 3, 0, 7); c.stroke();
    // замок
    c.fillStyle = w.sparksGot >= NEED ? '#7dff9a' : '#d33';
    rrect(c, x + cw / 2 - 4, y + ch / 2, 8, 7, 1.5); c.fill();
    c.strokeStyle = c.fillStyle; c.lineWidth = 1.4; c.beginPath(); c.arc(x + cw / 2, y + ch / 2, 2.6, Math.PI, 0); c.stroke();
    // табличка
    const need = Math.max(0, NEED - w.sparksGot);
    text(c, need > 0 ? `${w.sparksGot}/${NEED}` : 'ОТКРЫТЬ!', x + cw / 2, y - 12, 7, need > 0 ? '#ffd34d' : '#7dff9a');
  } else {
    c.strokeStyle = '#ffcf3d'; c.lineWidth = 1.6;
    c.beginPath(); c.moveTo(x + 2, y + ch - 4); c.lineTo(x + 2, y + 10); c.quadraticCurveTo(x + 10, y + 2, x + 16, y + 4); c.stroke();
    c.beginPath(); c.moveTo(x + cw - 2, y + ch - 4); c.lineTo(x + cw - 2, y + 10); c.stroke();
    if (f) drawFriend(c, f.x, f.y, w.t, false, w.player.x > f.x ? 1 : -1);
  }
}

// друг «Лайми» — лаймовый пузырёк
function drawFriend(c, x, y, t, sad, face) {
  const bob = sad ? Math.sin(t * 2) * 0.5 : -Math.abs(Math.sin(t * 8)) * 3;
  c.save(); c.translate(x, y + bob); c.scale(face, 1);
  shoe(c, -4, 10, '#3f7fff');
  const g = c.createRadialGradient(-3, -4, 1, 0, 0, 10);
  g.addColorStop(0, '#d9ffb0'); g.addColorStop(0.5, '#7fdc4a'); g.addColorStop(1, '#3f9f2a');
  c.fillStyle = g; circle(c, 0, 0, 9); c.fill();
  c.strokeStyle = '#2a6a1a'; c.lineWidth = 1; c.stroke();
  c.fillStyle = 'rgba(255,255,255,.6)'; c.beginPath(); c.ellipse(-4, -5, 2.6, 1.6, -0.6, 0, 7); c.fill();
  // кепка
  c.fillStyle = '#ff4d5a'; c.beginPath(); c.arc(0, -4, 8.6, Math.PI * 1.08, Math.PI * 1.92); c.fill(); c.fillRect(3, -7.5, 8, 2.2);
  // глаза
  for (const ex of [-1.5, 4]) { c.fillStyle = '#fff'; c.beginPath(); c.ellipse(ex, -0.5, 2.2, 2.8, 0, 0, 7); c.fill(); c.fillStyle = '#1a1a1a'; circle(c, ex + 0.7, sad ? 0.5 : -0.3, 1.2); c.fill(); }
  if (sad) { c.strokeStyle = '#1a3a10'; c.lineWidth = 0.9; c.beginPath(); c.moveTo(-3.5, -4.5); c.lineTo(0, -3.5); c.moveTo(6, -4.5); c.lineTo(2.5, -3.5); c.stroke(); }
  c.strokeStyle = '#1a3a10'; c.lineWidth = 1; c.beginPath();
  if (sad) c.arc(1.5, 6.5, 2.2, Math.PI * 1.15, Math.PI * 1.85); else c.arc(1.5, 3.5, 2.6, 0.15, Math.PI - 0.15);
  c.stroke();
  shoe(c, 4, 10, '#3f7fff');
  if (sad) { glove(c, -8, 6 + Math.sin(t * 3)); glove(c, 9, 5); }
  else { const k = Math.sin(t * 8) > 0; glove(c, -10, k ? -9 : 1); glove(c, 10, k ? 1 : -9); }
  c.restore();
}

// ---------- герой «Пузырь» ----------
function shoe(c, x, y, col = '#ff3b3b', rot = 0) {
  c.save(); c.translate(x, y); c.rotate(rot);
  c.fillStyle = col; c.beginPath(); c.ellipse(0.8, 0, 4.4, 2.8, 0, Math.PI, 0); c.lineTo(5.2, 1.4); c.lineTo(-3.6, 1.4); c.fill();
  c.fillStyle = '#fff'; c.fillRect(-3.8, 1, 9.2, 1.8); c.beginPath(); c.ellipse(4, 0, 1.6, 1.4, 0, 0, 7); c.fill();
  c.strokeStyle = 'rgba(0,0,0,.35)'; c.lineWidth = 0.5; c.beginPath(); c.moveTo(-1, -2); c.lineTo(1.4, -1); c.stroke();
  c.restore();
}
function glove(c, x, y) {
  c.fillStyle = '#fff'; circle(c, x, y, 3.3); c.fill();
  c.strokeStyle = '#7d8798'; c.lineWidth = 0.7; c.stroke();
  c.fillStyle = '#e3e7ee'; c.beginPath(); c.arc(x, y, 2, 0.4, 2); c.fill();
}

function heroPose(s) {
  const P = { bob: 0, sx: 1, sy: 1, rot: 0, hb: [-11, 3], hf: [11, 3], fb: [-4, 10], ff: [4, 10], mouth: 'smile', gl: { dy: 0, rot: 0, on: true }, eyes: 'cool' };
  const t = s.t;
  switch (s.st) {
    case 'idle': {
      P.bob = Math.sin(t * 3) * 0.8; P.hb = [-11, 3 + P.bob * 0.6]; P.hf = [11, 3 - P.bob * 0.6];
      if (s.twirl > 0) {           // крутит очки
        const k = 1 - s.twirl / 1.2;
        P.hf = [7 + Math.cos(k * 12) * 2, -8 + Math.sin(k * 12) * 2];
        P.gl.dy = -7 * Math.sin(Math.PI * Math.min(1, k * 1.1)); P.gl.rot = Math.min(1, k * 1.2) * Math.PI * 2; P.mouth = 'smirk';
      }
      break;
    }
    case 'run': {
      const ph = s.run * 2.2;
      P.bob = -Math.abs(Math.sin(ph)) * 1.6; P.rot = 0.09;
      P.ff = [Math.sin(ph) * 5 + 1, 10 - Math.max(0, Math.cos(ph)) * 3]; P.fb = [-Math.sin(ph) * 5 - 1, 10 - Math.max(0, -Math.cos(ph)) * 3];
      P.hf = [8 - Math.sin(ph) * 4, 4 - Math.abs(Math.cos(ph))]; P.hb = [-8 + Math.sin(ph) * 4, 4 - Math.abs(Math.cos(ph))];
      break;
    }
    case 'jump': P.sy = 1.1; P.sx = 0.92; P.hb = [-10, -8]; P.hf = [10, -9]; P.fb = [-3, 10]; P.ff = [4, 8.5]; P.mouth = 'o'; break;
    case 'fall': { const f = Math.sin(t * 22); P.hb = [-12, -4 + f]; P.hf = [12, -5 - f]; P.fb = [-5, 11]; P.ff = [5, 11]; P.mouth = 'o'; break; }
    case 'spring': P.rot = t * 14; P.hb = [-10, -7]; P.hf = [10, -7]; P.fb = [-3, 9]; P.ff = [3, 9]; P.mouth = 'grin'; break;
    case 'climb': { const ph = s.run * 3; P.hb = [-3, -10 + Math.sin(ph) * 3]; P.hf = [3, -10 - Math.sin(ph) * 3]; P.fb = [-4, 10 - Math.sin(ph) * 2]; P.ff = [4, 10 + Math.sin(ph) * 2]; break; }
    case 'hurt': P.hb = [-12, -6]; P.hf = [12, -6]; P.fb = [-6, 10]; P.ff = [6, 10]; P.mouth = 'o'; P.gl.on = false; P.eyes = 'x'; P.sx = 1.12; P.sy = 0.9; P.rot = -0.2; break;
    case 'win': {
      const ph = t * 8, up = Math.sin(ph) > 0;
      P.bob = -Math.abs(Math.sin(ph)) * 4; P.rot = Math.sin(ph / 2) * 0.2;
      P.hb = [-11, up ? -11 : 1]; P.hf = [11, up ? 1 : -11]; P.ff = [4 + Math.sin(ph) * 2, 10]; P.fb = [-4 - Math.sin(ph) * 2, 10]; P.mouth = 'grin';
      if (Math.sin(t * 1.3) > 0.7) { P.gl.dy = -6; P.eyes = 'happy'; }
      break;
    }
  }
  if (s.shoot > 0 && s.st !== 'climb') P.hf = s.aimUp ? (s.aimDiag ? [11, -11] : [2, -15]) : [15, 1];
  else if (s.shoot > 0) P.hf = [13, -2];
  if (s.sq > 0) { P.sx *= 1 + s.sq * 0.6; P.sy *= 1 - s.sq * 0.5; }
  return P;
}

function drawHero(c, x, y, s) {
  const P = heroPose(s), f = s.face, R = 9.5;
  c.save(); c.translate(x, y + P.bob);
  if (P.rot) c.rotate(P.rot * f);
  c.scale(f, 1);
  shoe(c, P.fb[0], P.fb[1], '#d92c2c');
  glove(c, P.hb[0], P.hb[1]);
  // тело (сжатие/растяжение от низа)
  c.save(); c.translate(0, R); c.scale(P.sx, P.sy); c.translate(0, -R);
  const g = c.createRadialGradient(-3.5, -4, 1, 0, 0, R + 1);
  g.addColorStop(0, '#ffd27a'); g.addColorStop(0.45, '#ff9a2a'); g.addColorStop(1, '#e8600a');
  c.fillStyle = g; circle(c, 0, 0, R); c.fill();
  c.strokeStyle = '#9a3a00'; c.lineWidth = 1.1; c.stroke();
  // пузырьки газировки внутри
  c.fillStyle = 'rgba(255,240,200,.55)';
  for (let i = 0; i < 3; i++) { const k = (s.t * 0.6 + i / 3) % 1; circle(c, -4 + i * 3.5, 6 - k * 13, 0.8 + i * 0.3); c.fill(); }
  c.fillStyle = 'rgba(255,255,255,.65)'; c.beginPath(); c.ellipse(-4.2, -5, 3, 1.8, -0.6, 0, 7); c.fill();
  // глаза (видны, когда очки сняты/подняты)
  if (!P.gl.on || P.gl.dy < -3) {
    if (P.eyes === 'x') {
      c.strokeStyle = '#3a1500'; c.lineWidth = 1.2; c.beginPath();
      for (const ex of [-1.5, 4.5]) { c.moveTo(ex - 1.6, -3.6); c.lineTo(ex + 1.6, -0.4); c.moveTo(ex + 1.6, -3.6); c.lineTo(ex - 1.6, -0.4); }
      c.stroke();
    } else if (P.eyes === 'happy') {
      c.strokeStyle = '#3a1500'; c.lineWidth = 1.2; c.beginPath();
      for (const ex of [-1.5, 4.5]) { c.moveTo(ex - 1.8, -1.6); c.quadraticCurveTo(ex, -4, ex + 1.8, -1.6); } c.stroke();
    } else {
      for (const ex of [-1.5, 4.5]) {
        c.fillStyle = '#fff'; c.beginPath(); c.ellipse(ex, -2, 2, 2.3, 0, 0, 7); c.fill();
        c.fillStyle = '#2a1000'; circle(c, ex + 0.8, -1.6, 1.1); c.fill();
        c.fillStyle = '#e8600a'; c.fillRect(ex - 2.2, -4.6, 4.4, 1.8);    // полуприкрытые веки — расслабленный взгляд
      }
    }
  }
  // рот
  c.strokeStyle = '#5a1e00'; c.lineWidth = 1.1; c.lineCap = 'round';
  if (P.mouth === 'smile') { c.beginPath(); c.arc(3, 2.5, 3, 0.25, Math.PI - 0.9); c.stroke(); }
  else if (P.mouth === 'smirk') { c.beginPath(); c.moveTo(0.5, 4.5); c.quadraticCurveTo(3.5, 5.5, 6.5, 2.5); c.stroke(); }
  else if (P.mouth === 'o') { c.fillStyle = '#5a1e00'; c.beginPath(); c.ellipse(3.5, 4.5, 1.5, 2, 0, 0, 7); c.fill(); }
  else if (P.mouth === 'grin') {
    c.fillStyle = '#5a1e00'; c.beginPath(); c.arc(3, 2.8, 3.6, 0.1, Math.PI - 0.1); c.fill();
    c.fillStyle = '#fff'; c.fillRect(0.2, 3, 5.6, 1.2);
  }
  // солнечные очки
  if (P.gl.on) {
    c.save(); c.translate(1.5, -2 + P.gl.dy); c.rotate(P.gl.rot);
    c.strokeStyle = '#111'; c.lineWidth = 1; c.beginPath(); c.moveTo(-4, -0.5); c.lineTo(-9.5, 0.5); c.stroke();
    c.fillStyle = '#121212';
    c.beginPath(); c.moveTo(-5.5, -2); c.lineTo(-0.5, -2.2); c.quadraticCurveTo(-0.5, 2.5, -3.2, 2.2); c.quadraticCurveTo(-5.5, 2, -5.5, -2); c.fill();
    c.beginPath(); c.moveTo(0.5, -2.2); c.lineTo(7.2, -2.4); c.quadraticCurveTo(7.4, 2.8, 3.8, 2.6); c.quadraticCurveTo(0.6, 2.4, 0.5, -2.2); c.fill();
    c.fillRect(-1, -2.3, 2, 1.2);
    c.strokeStyle = 'rgba(255,255,255,.75)'; c.lineWidth = 0.8;
    c.beginPath(); c.moveTo(2, -1); c.lineTo(3.5, -1.6); c.moveTo(-4.2, -0.8); c.lineTo(-3, -1.3); c.stroke();
    c.restore();
  } else if (P.eyes === 'x') {
    c.save(); c.translate(-6, -12); c.rotate(-0.6); c.fillStyle = '#121212'; c.fillRect(-4, -1.5, 9, 3); c.restore();
  }
  c.restore();
  shoe(c, P.ff[0], P.ff[1], '#ff3b3b');
  glove(c, P.hf[0], P.hf[1]);
  c.restore();
}

function drawPlayer(w, alpha) {
  const p = w.player, c = ctx;
  const x = lerp(p.px, p.x, alpha), y = lerp(p.py, p.y, alpha);
  if (p.dead) {
    if (p.deadT < 0.25) { const k = 1 + p.deadT * 3; c.save(); c.translate(x + p.w / 2, y + 8); c.scale(k, k); c.globalAlpha = 1 - p.deadT * 4; circle(c, 0, 0, 9.5, '#ff9a2a'); c.restore(); }
    return;
  }
  if (p.inv > 0 && !w.won && Math.floor(p.inv * 15) % 2 === 0) return;
  // тень
  if (p.onGround) { c.fillStyle = 'rgba(0,0,0,.18)'; c.beginPath(); c.ellipse(x + p.w / 2, y + p.h, 9, 2, 0, 0, 7); c.fill(); }
  drawHero(c, x + p.w / 2, y + 8, { st: p.anim, t: p.t, face: p.face, run: p.run, twirl: p.twirl, shoot: p.shootT, aimUp: p.aimUp, aimDiag: p.aimDiag, sq: p.sq });
}

// ---------- враги ----------
function drawEnemy(c, e, t) {
  const x = e.x + e.w / 2, y = e.y + e.h / 2;
  c.save(); c.translate(x, y);
  if (e.hitT > 0) c.globalAlpha = 0.45;
  const f = e.face;
  switch (e.kind) {
    case 'crab': {
      const l = Math.sin(e.t * 14);
      c.strokeStyle = '#b8231f'; c.lineWidth = 1.5;
      for (let i = -1; i <= 1; i += 2) for (let j = 0; j < 3; j++) { c.beginPath(); c.moveTo(i * 4, 2); c.lineTo(i * (8 + j * 1.5), 6 + (j % 2 ? l : -l)); c.stroke(); }
      c.fillStyle = '#ff4a3d'; c.beginPath(); c.ellipse(0, 1, 9, 5.5, 0, 0, 7); c.fill();
      c.fillStyle = '#ff8a7a'; c.beginPath(); c.ellipse(-2, -1, 4, 2, 0, 0, 7); c.fill();
      const cl = Math.sin(e.t * 6) * 0.4;
      for (const i of [-1, 1]) {
        c.save(); c.translate(i * 10, -3); c.rotate(i * (0.4 + cl));
        c.fillStyle = '#ff4a3d'; c.beginPath(); c.arc(0, -2, 3.6, 0, 7); c.fill();
        c.fillStyle = '#7a1510'; c.beginPath(); c.moveTo(0, -2); c.lineTo(i * 3, -5); c.lineTo(i * 1, -2); c.fill(); c.restore();
      }
      c.strokeStyle = '#b8231f'; c.lineWidth = 1.2; c.beginPath(); c.moveTo(-2.5, -3); c.lineTo(-3, -8); c.moveTo(2.5, -3); c.lineTo(3, -8); c.stroke();
      for (const i of [-3, 3]) { circle(c, i, -8.5, 2.2, '#fff'); circle(c, i + 0.5 * f, -8.5, 1, '#111'); }
      break;
    }
    case 'cray': {
      c.scale(f, 1);
      const sn = e.state === 'snap' ? Math.abs(Math.sin(e.t * 18)) : Math.sin(e.t * 4) * 0.2;
      c.fillStyle = '#a3281b';
      for (let i = 0; i < 4; i++) { c.beginPath(); c.ellipse(-4 - i * 3.6, 1 + i * 0.4, 3, 3.6 - i * 0.4, 0, 0, 7); c.fill(); }
      c.beginPath(); c.moveTo(-17, 1); c.lineTo(-22, -3); c.lineTo(-22, 5); c.fill();
      c.fillStyle = '#d23a26'; c.beginPath(); c.ellipse(3, 0, 7, 4.8, 0, 0, 7); c.fill();
      c.strokeStyle = '#7a1510'; c.lineWidth = 1;
      c.beginPath(); c.moveTo(8, -2); c.quadraticCurveTo(16, -10, 22, -6); c.moveTo(8, -1); c.quadraticCurveTo(15, -8, 20, -2); c.stroke();
      c.fillStyle = '#d23a26';
      c.save(); c.translate(11, 3); c.rotate(-sn * 0.5); c.beginPath(); c.ellipse(4, 0, 5, 2.6, 0, 0, 7); c.fill(); c.restore();
      c.save(); c.translate(11, 3); c.rotate(sn * 0.5); c.beginPath(); c.ellipse(4, 1.5, 4.5, 2, 0, 0, 7); c.fill(); c.restore();
      circle(c, 6, -4, 1.8, '#fff'); circle(c, 6.6, -4, 0.9, '#111');
      break;
    }
    case 'flea': {
      c.scale(f, 1);
      const air = !e.onGround;
      c.strokeStyle = '#6b4a1e'; c.lineWidth = 1.3;
      c.beginPath(); c.moveTo(-1, 2); c.lineTo(air ? -6 : -5, air ? 7 : -1); c.lineTo(air ? -8 : -6, 5); c.stroke();
      c.beginPath(); c.moveTo(1, 2); c.lineTo(air ? -3 : 3, air ? 8 : -2); c.lineTo(air ? -4 : 5, 5); c.stroke();
      c.fillStyle = '#c99a5a'; c.beginPath(); c.ellipse(0, 0, 5.5, 4.2, -0.2, 0, 7); c.fill();
      c.fillStyle = '#e8c38a'; c.beginPath(); c.ellipse(-1.5, -1.5, 2.5, 1.4, -0.2, 0, 7); c.fill();
      circle(c, 3.5, -1.5, 1.6, '#fff'); circle(c, 4, -1.5, 0.8, '#111');
      c.beginPath(); c.moveTo(4, -3.5); c.lineTo(7, -7); c.stroke();
      break;
    }
    case 'gull': {
      c.scale(f, 1);
      const fl = Math.sin(e.t * (e.state === 'dive' ? 4 : 12));
      c.fillStyle = '#c9d2dc'; c.beginPath(); c.moveTo(-2, -1); c.lineTo(-10, -1 - fl * 8); c.lineTo(4, -2); c.fill();
      c.fillStyle = '#fff'; c.beginPath(); c.ellipse(0, 0, 9, 5, e.state === 'dive' ? 0.5 : 0, 0, 7); c.fill();
      c.fillStyle = '#9aa6b2'; c.beginPath(); c.moveTo(-8, -1); c.lineTo(-13, -3); c.lineTo(-12, 2); c.fill();
      circle(c, 7, -3, 4, '#fff');
      c.fillStyle = '#ffb12f'; c.beginPath(); c.moveTo(10, -3.5); c.lineTo(15, -2); c.lineTo(10, -1); c.fill();
      circle(c, 8, -4, 1, '#111');
      c.fillStyle = '#e3e9ef'; c.beginPath(); c.moveTo(0, -1); c.lineTo(-6, -1 + fl * 8); c.lineTo(6, -2); c.fill();
      break;
    }
    case 'bat': {
      if (e.state === 'hang') {
        c.fillStyle = '#5b3a8a'; c.beginPath(); c.ellipse(0, 0, 4.5, 6.5, 0, 0, 7); c.fill();
        c.strokeStyle = '#3a2160'; c.lineWidth = 1.2; c.beginPath(); c.moveTo(-1.5, -6); c.lineTo(-1.5, -8); c.moveTo(1.5, -6); c.lineTo(1.5, -8); c.stroke();
        c.fillStyle = '#ffde59'; c.fillRect(-2.5, 1, 1.4, 1.2); c.fillRect(1.1, 1, 1.4, 1.2);
      } else {
        const fl = Math.sin(e.t * 16);
        c.fillStyle = '#4a2c76';
        for (const s of [-1, 1]) { c.beginPath(); c.moveTo(0, -1); c.lineTo(s * 12, -4 - fl * 5); c.lineTo(s * 9, 2); c.lineTo(s * 5, 0); c.fill(); }
        c.fillStyle = '#6b47a8'; circle(c, 0, 0, 5); c.fill();
        c.beginPath(); c.moveTo(-3, -3); c.lineTo(-3.5, -7); c.lineTo(-1, -4); c.moveTo(3, -3); c.lineTo(3.5, -7); c.lineTo(1, -4); c.fill();
        circle(c, -1.8, -0.5, 1.2, '#ffde59'); circle(c, 1.8, -0.5, 1.2, '#ffde59');
        c.fillStyle = '#fff'; c.fillRect(-1.2, 2, 0.8, 1.4); c.fillRect(0.5, 2, 0.8, 1.4);
      }
      break;
    }
    case 'trap': {
      c.fillStyle = '#c99a5a'; rrect(c, -11, 0, 22, 4, 1.5); c.fill();
      c.fillStyle = '#8a6030'; c.fillRect(-11, 3, 22, 1);
      c.fillStyle = '#ffd34d'; c.beginPath(); c.moveTo(4, 0); c.lineTo(10, 0); c.lineTo(10, -4); c.fill();
      c.fillStyle = '#e8b52c'; circle(c, 8, -1.2, 0.7); c.fill();
      c.strokeStyle = '#b8c2cc'; c.lineWidth = 1.4;
      const armed = e.state === 'armed';
      const ang = !armed ? -0.05 : e.snap > 0 ? Math.PI * (e.snap / 0.35) : Math.PI - 0.05;
      c.beginPath(); c.moveTo(-2, 0); c.lineTo(-2 + Math.cos(ang) * 9, -Math.sin(ang) * 9); c.stroke();
      c.beginPath(); c.arc(-2, 0, 2, 0, 7); c.stroke();
      if (!armed) { c.globalAlpha = 0.6; text(c, 'zz', 6, -8, 5, '#fff', 'center', null); c.globalAlpha = 1; }
      break;
    }
    case 'toy': {
      c.scale(f, 1);
      const ph = e.t % 4.2, walking = ph < 3, l = walking ? Math.sin(e.t * 16) * 2 : 0;
      c.fillStyle = '#556070'; c.fillRect(-5 + l, 6, 3, 3); c.fillRect(2 - l, 6, 3, 3);
      c.fillStyle = '#c6ced8'; rrect(c, -7, -6, 14, 13, 2); c.fill();
      c.fillStyle = '#ff5f6f'; c.fillRect(-7, 0, 14, 2.5);
      c.fillStyle = '#9aa6b2'; rrect(c, -5, -12, 11, 7, 2); c.fill();
      c.fillStyle = '#ffde59'; circle(c, 3.5, -8.5, 1.6); c.fill();
      c.strokeStyle = '#2a3440'; c.lineWidth = 1; c.beginPath(); c.moveTo(0, -12); c.lineTo(0, -15); c.stroke(); circle(c, 0, -15.5, 1.2, '#ff5f6f');
      c.save(); c.translate(-8, 0); c.rotate(e.t * (walking ? 6 : 1.5));
      c.fillStyle = '#ffd34d'; c.fillRect(-1, -1, 2, 2); c.beginPath(); c.ellipse(0, -3.5, 1.8, 2.8, 0, 0, 7); c.ellipse(0, 3.5, 1.8, 2.8, 0, 0, 7); c.fill();
      c.restore();
      break;
    }
    case 'duck': {
      c.scale(f, 1);
      const rc = e.recoil > 0 ? -e.recoil * 6 : 0;
      c.translate(rc, 0);
      c.fillStyle = '#ffd52e'; c.beginPath(); c.ellipse(-1, 3, 10, 6.5, 0, 0, 7); c.fill();
      c.beginPath(); c.moveTo(-10, 0); c.lineTo(-13, -4); c.lineTo(-7, -1); c.fill();
      circle(c, 3, -5, 5.5, '#ffd52e');
      c.fillStyle = '#f4b400'; c.beginPath(); c.ellipse(-3, 3, 5, 3, 0.2, 0, 7); c.fill();
      c.fillStyle = '#3a3f4a'; rrect(c, 6, -7, 9, 5, 1.5); c.fill();
      c.fillStyle = '#ff8a1f'; c.fillRect(13, -7.5, 2.5, 6);
      circle(c, 4.5, -6.5, 1.5, '#fff'); circle(c, 5, -6.5, 0.8, '#111');
      c.fillStyle = 'rgba(255,255,255,.6)'; c.beginPath(); c.ellipse(-4, 0, 3, 1.2, -0.3, 0, 7); c.fill();
      break;
    }
  }
  c.globalAlpha = 1;
  c.restore();
  if (e.maxHp > 1 && e.hp < e.maxHp && !e.dead && !(e.kind === 'trap' && e.state !== 'armed')) {
    c.fillStyle = 'rgba(0,0,0,.4)'; c.fillRect(e.x, e.y - 6, e.w, 2.5);
    c.fillStyle = '#7dff9a'; c.fillRect(e.x, e.y - 6, e.w * e.hp / e.maxHp, 2.5);
  }
}

function drawPlats(w) {
  const c = ctx;
  for (const pl of w.plats) {
    if (pl.dead) continue;
    const cx = pl.x + pl.w / 2;
    const r = pl.r || 22;
    const wob = pl.kind === 'rise' && pl.ridden ? Math.sin(w.t * 40) * (1.5 - pl.popT) * 1.2 : Math.sin(w.t * 3 + (pl.ph || pl.wob || 0)) * 0.6;
    const cy = pl.y + r * 0.8;
    c.save(); c.translate(cx, cy); c.scale(1 + wob * 0.05, 1 - wob * 0.05);
    c.fillStyle = 'rgba(200,240,255,.28)'; circle(c, 0, 0, r); c.fill();
    c.strokeStyle = 'rgba(255,255,255,.85)'; c.lineWidth = 1.6; c.stroke();
    c.strokeStyle = 'rgba(255,170,230,.5)'; c.lineWidth = 1; circle(c, 0, 0, r - 2); c.stroke();
    c.fillStyle = 'rgba(255,255,255,.75)'; c.beginPath(); c.ellipse(-r * 0.4, -r * 0.42, r * 0.28, r * 0.15, -0.6, 0, 7); c.fill();
    circle(c, r * 0.45, r * 0.3, r * 0.07, 'rgba(255,255,255,.7)');
    c.restore();
  }
}

function drawShots(w) {
  const c = ctx;
  for (const s of w.shots) {
    c.fillStyle = 'rgba(210,245,255,.45)'; circle(c, s.x, s.y, s.r); c.fill();
    c.strokeStyle = '#fff'; c.lineWidth = 1.1; c.stroke();
    circle(c, s.x - 1.3, s.y - 1.3, 1.1, '#fff');
    c.fillStyle = 'rgba(255,255,255,.5)'; circle(c, s.x - s.vx * 0.015, s.y - s.vy * 0.015, 1.5); c.fill();
  }
  for (const q of w.eshots) {
    c.fillStyle = '#4fb8ff'; circle(c, q.x, q.y, q.r); c.fill();
    c.fillStyle = '#d6f1ff'; circle(c, q.x - 1, q.y - 1, 1.3); c.fill();
  }
}

function drawParticles(w) {
  const c = ctx;
  for (const q of w.parts) {
    const k = 1 - q.life / q.max;
    c.globalAlpha = Math.min(1, k * 1.6);
    if (q.type === 'bubble') { c.strokeStyle = q.col; c.lineWidth = 0.8; circle(c, q.x, q.y, q.size * 1.4); c.stroke(); }
    else if (q.type === 'confetti') { c.save(); c.translate(q.x, q.y); c.rotate(q.rot); c.fillStyle = q.col; c.fillRect(-q.size, -q.size * 0.5, q.size * 2, q.size); c.restore(); }
    else if (q.type === 'star') { c.fillStyle = q.col; c.save(); c.translate(q.x, q.y); c.rotate(q.rot); c.fillRect(-q.size * 1.2, -0.5, q.size * 2.4, 1); c.fillRect(-0.5, -q.size * 1.2, 1, q.size * 2.4); c.restore(); }
    else { c.fillStyle = q.col; circle(c, q.x, q.y, q.size * k + 0.3); c.fill(); }
  }
  c.globalAlpha = 1;
  for (const t of w.pops) {
    const k = t.t / 1.1;
    c.globalAlpha = 1 - k * k;
    const sc = t.t < 0.12 ? 0.6 + t.t * 3.4 : 1;
    text(c, t.text, t.x, t.y - t.t * 26, (t.big ? 13 : 8) * sc, t.col);
  }
  c.globalAlpha = 1;
}

// ---------- HUD ----------
function drawHUD(w) {
  const c = ctx, b = hudBounds(), p = w.player;
  const L = b.l, Tp = b.t;
  // шипучесть
  c.fillStyle = 'rgba(16,24,58,.55)'; rrect(c, L, Tp, 92, 38, 9); c.fill();
  for (let i = 0; i < MAX_FIZZ; i++) {
    const on = i < p.fizz, x = L + 12 + i * 17, y = Tp + 10;
    const low = p.fizz <= 1 && Math.sin(w.t * 12) > 0;
    c.fillStyle = on ? (low ? '#ff5a3a' : '#ff9a2a') : 'rgba(255,255,255,.15)'; circle(c, x, y, 6.2); c.fill();
    if (on) { circle(c, x - 2, y - 2, 1.8, 'rgba(255,255,255,.75)'); }
    c.strokeStyle = 'rgba(255,255,255,.7)'; c.lineWidth = 1; circle(c, x, y, 6.2); c.stroke();
  }
  // жизни
  c.save(); c.translate(L + 12, Tp + 27); c.scale(0.55, 0.55);
  drawHero(c, 0, 0, { st: 'idle', t: 0, face: 1, run: 0, twirl: 0, shoot: 0, sq: 0 });
  c.restore();
  text(c, '×' + game.lives, L + 22, Tp + 28, 8, '#fff', 'left', '#10183a', 2.5);
  // таймер + счёт
  const cx = (L + b.r) / 2 + 10;
  const low = w.time <= (w.bonus ? 8 : 20);
  const ts = low ? 15 + Math.max(0, Math.sin(w.t * 8)) * 2 : 15;
  text(c, fmtTime(w.time), cx, Tp + 10, ts, low ? '#ff5a5a' : '#fff');
  text(c, String(game.score).padStart(6, '0'), cx, Tp + 25, 8, '#ffd34d', 'center', '#10183a', 2.5);
  // искры
  const R = b.r;
  c.fillStyle = 'rgba(16,24,58,.55)'; rrect(c, R - 74, Tp, 74, 30, 9); c.fill();
  const sp = sprites.get('spark');
  if (sp) c.drawImage(sp, R - 72, Tp + 3, 24, 24);
  const got = w.sparksGot;
  if (w.bonus) text(c, String(got), R - 46, Tp + 15, 12, '#fff', 'left', '#10183a', 3);
  else {
    const ok = got >= NEED;
    text(c, `${got}/${NEED}`, R - 46, Tp + 12, 11, ok ? '#7dff9a' : '#fff', 'left', '#10183a', 3);
    text(c, `из ${w.sparksTotal}`, R - 46, Tp + 24, 6, 'rgba(255,255,255,.75)', 'left', null);
  }
  // баннер уровня
  if (w.introT > 0) {
    const k = w.introT, a = Math.min(1, k * 2, (3 - k) * 3);
    const y = 82 - (1 - Math.min(1, (3 - k) * 3)) * 30;
    c.globalAlpha = Math.max(0, a);
    c.fillStyle = 'rgba(16,24,58,.75)'; rrect(c, VW / 2 - 150, y - 26, 300, 54, 14); c.fill();
    c.strokeStyle = '#fff'; c.lineWidth = 2; c.stroke();
    if (w.bonus) {
      text(c, 'БОНУС: ВНУТРИ БУТЫЛКИ', VW / 2, y - 9, 13, '#ffd34d');
      text(c, 'Прыгай по пузырям вверх и собирай искры!', VW / 2, y + 12, 7.5, '#fff', 'center', null);
    } else {
      text(c, `УРОВЕНЬ ${w.idx + 1} · ${w.def.name.toUpperCase()}`, VW / 2, y - 9, 13, '#ffd34d');
      text(c, `Собери ${NEED} искр и освободи друга из клетки!`, VW / 2, y + 12, 7.5, '#fff', 'center', null);
    }
    c.globalAlpha = 1;
  }
  if (w.msgT > 0 && w.msg) {
    c.globalAlpha = Math.min(1, w.msgT * 3);
    c.font = `900 9px ${FONT}`;
    const tw = c.measureText(w.msg).width + 24;
    c.fillStyle = 'rgba(16,24,58,.72)'; rrect(c, VW / 2 - tw / 2, VH - 58, tw, 20, 10); c.fill();
    text(c, w.msg, VW / 2, VH - 48, 9, '#fff', 'center', null);
    c.globalAlpha = 1;
  }
}

// ---------- кадр мира ----------
function renderWorld(w, alpha) {
  const c = ctx;
  let cx = lerp(w.cam.px, w.cam.x, alpha), cy = lerp(w.cam.py, w.cam.y, alpha);
  if (w.shake > 0) { cx += rnd(-1, 1) * w.shake * 0.5; cy += rnd(-1, 1) * w.shake * 0.5; }
  cx = Math.round(cx * S) / S; cy = Math.round(cy * S) / S;
  c.save();
  c.beginPath(); c.rect(0, 0, VW, VH); c.clip();
  drawBackground(w, cx, cy);
  c.translate(-cx, -cy);
  drawPiles(w, cx);
  drawDecor(w, cx);
  drawRuns(w, cx);
  drawTiles(w, cx, cy);
  drawItems(w);
  drawSparks(w, cx, cy);
  drawCage(w);
  drawPlats(w);
  for (const e of w.enemies) if (!e.dead && e.x > cx - 40 && e.x < cx + VW + 40 && e.y > cy - 40 && e.y < cy + VH + 40) drawEnemy(c, e, w.t);
  drawPlayer(w, alpha);
  drawShots(w);
  drawWater(w, cx, cy);
  drawParticles(w);
  c.restore();
  if (w.flash > 0) { c.globalAlpha = Math.min(0.6, w.flash); c.fillStyle = w.flashCol; c.fillRect(0, 0, VW, VH); c.globalAlpha = 1; }
  if (w.bonus) { const g = c.createLinearGradient(0, 0, VW, 0); g.addColorStop(0, 'rgba(0,30,15,.5)'); g.addColorStop(0.2, 'rgba(0,0,0,0)'); g.addColorStop(0.8, 'rgba(0,0,0,0)'); g.addColorStop(1, 'rgba(0,30,15,.5)'); c.fillStyle = g; c.fillRect(0, 0, VW, VH); }
  drawHUD(w);
}

// ---------- титульный экран ----------
const titleScene = { t: 0, x: 0 };
function renderTitle(dt) {
  const c = ctx, ts = titleScene;
  drawBeachBG(ts.x, 0, ts.t);
  // песок
  c.fillStyle = '#efc576'; c.fillRect(0, 214, VW, VH);
  c.fillStyle = '#ffe7a8'; c.fillRect(0, 214, VW, 4);
  c.fillStyle = 'rgba(30,170,215,.85)'; c.beginPath(); c.moveTo(0, VH);
  for (let x = 0; x <= VW; x += 6) c.lineTo(x, 252 + Math.sin(x * 0.05 + ts.t * 2) * 2);
  c.lineTo(VW, VH); c.fill();
  // герой и друг
  const dance = Math.sin(ts.t * 0.5) > 0;
  drawHero(c, VW * 0.3, 202, { st: dance ? 'win' : 'idle', t: ts.t, face: 1, run: 0, twirl: dance ? 0 : (ts.t % 5 < 1.2 ? 1.2 - ts.t % 5 : 0), shoot: 0, sq: 0 });
  drawFriend(c, VW * 0.72, 202, ts.t, false, -1);
  // логотип
  const word = 'FIZZY SPOT';
  const size = 44, sp = size * 0.62;
  let x = VW / 2 - (word.length - 1) * sp / 2;
  for (let i = 0; i < word.length; i++) {
    const ch = word[i];
    if (ch !== ' ') {
      const y = 70 + Math.sin(ts.t * 3 + i * 0.6) * 4, rot = Math.sin(ts.t * 2 + i) * 0.06;
      c.save(); c.translate(x, y); c.rotate(rot);
      c.font = `900 ${size}px ${FONT}`; c.textAlign = 'center'; c.textBaseline = 'middle';
      c.lineJoin = 'round'; c.lineWidth = 10; c.strokeStyle = '#10183a'; c.strokeText(ch, 0, 3);
      c.lineWidth = 7; c.strokeStyle = '#fff'; c.strokeText(ch, 0, 0);
      c.fillStyle = grad('logo', () => vgrad(['#ffe36a', '#ffa21f', '#ff5a1f'], -20, 20)); c.fillText(ch, 0, 0);
      c.fillStyle = 'rgba(255,255,255,.55)'; circle(c, -6, -10, 2.5); c.fill();
      c.restore();
    }
    x += sp;
  }
  text(c, 'газированное приключение', VW / 2, 108, 10, '#fff', 'center', '#1a5c96', 3);
  // пузыри
  for (let i = 0; i < 14; i++) {
    const bx = wrap(i * 47 + Math.sin(ts.t + i) * 8, VW), by = wrap(240 - ts.t * (20 + i % 4 * 8) - i * 31, 260);
    c.strokeStyle = 'rgba(255,255,255,.7)'; c.lineWidth = 1; circle(c, bx, by, 2 + i % 3); c.stroke();
  }
}

// ---------- финальный экран (танец) ----------
function renderCelebrate(t) {
  const c = ctx;
  drawBeachBG(t * 10, 0, t);
  c.fillStyle = '#efc576'; c.fillRect(0, 214, VW, VH);
  drawHero(c, VW * 0.42, 202, { st: 'win', t, face: 1, run: 0, twirl: 0, shoot: 0, sq: 0 });
  drawFriend(c, VW * 0.58, 202, t, false, -1);
  const cols = ['#ff5fa2', '#ffd34d', '#5fd0ff', '#7dff9a', '#fff'];
  for (let i = 0; i < 40; i++) {
    const x = wrap(i * 37.3 + Math.sin(t + i) * 12, VW), y = wrap(i * 53 + t * (30 + i % 5 * 9), VH + 20) - 10;
    c.save(); c.translate(x, y); c.rotate(t * 3 + i); c.fillStyle = cols[i % 5]; c.fillRect(-2.5, -1.2, 5, 2.4); c.restore();
  }
}

// =====================================================================
// ЭКРАНЫ И ПЕРЕХОДЫ
// =====================================================================
const screens = ['title', 'pause', 'complete', 'over'];
function showScreen(id) {
  for (const s of screens) $(s).classList.toggle('on', s === id);
  game.menuReadyAt = performance.now() + 350;
  updateControlsVisibility();
}
function updateControlsVisibility() {
  const playing = (game.state === 'play' || game.state === 'bonus') && !game.paused;
  elControls.classList.toggle('on', isTouch && playing);
  $('top').classList.toggle('on', game.state === 'play' || game.state === 'bonus');
  if (!playing) resetTouch();
}

function showTitle() {
  game.state = 'title'; game.paused = false; world = null;
  $('titleBest').textContent = game.best > 0 ? `Рекорд: ${game.best}` : '';
  $('titleHint').innerHTML = isTouch
    ? 'Джойстик слева · «Прыжок» и «Огонь» справа · держите прыжок дольше — прыжок выше'
    : '← → ↑ ↓ — движение и лазанье · Z — прыжок (держите для высоты) · X — огонь · P — пауза · M — звук';
  showScreen('title');
  Sound.playSong('title');
}

function startGame() {
  Sound.init(); Sound.play('select');
  game.score = 0; game.lives = 3; game.totalSparks = 0;
  startLevel(0);
}
function startLevel(i) {
  game.levelIdx = i; game.state = 'play'; game.paused = false;
  world = buildLevel(i);
  input.jumpHit = input.fireHit = false;
  showScreen(null);
  Sound.playSong(LEVELS[i].song);
}

function showComplete() {
  const w = world;
  game.state = 'complete';
  const timeBonus = Math.floor(w.time) * 10, sparkBonus = w.sparksGot * 20, allBonus = w.sparksGot >= w.sparksTotal ? 3000 : 0;
  game.score += timeBonus + sparkBonus + allBonus;
  $('cTitle').textContent = `${w.def.name}: пройдено!`;
  $('cStats').innerHTML =
    `<tr><td>Искры</td><td>${w.sparksGot} / ${w.sparksTotal}</td></tr>` +
    `<tr><td>Врагов лопнуто</td><td>${w.kills}</td></tr>` +
    `<tr><td>Бонус за время (${Math.floor(w.time)} с)</td><td>+${timeBonus}</td></tr>` +
    `<tr><td>Бонус за искры</td><td>+${sparkBonus}</td></tr>` +
    (allBonus ? `<tr><td>Все искры собраны!</td><td>+${allBonus}</td></tr>` : '') +
    `<tr class="total"><td>Счёт</td><td>${game.score}</td></tr>`;
  $('btnNext').textContent = 'Бонус-раунд ▶';
  $('btnNext').onclick = startBonus;
  showScreen('complete');
  Sound.playSong('title');
}

function startBonus() {
  Sound.play('select');
  game.state = 'bonus'; game.paused = false;
  world = buildBonus();
  input.jumpHit = input.fireHit = false;
  showScreen(null);
  Sound.playSong('bonus');
}

function showBonusResult() {
  const r = game.bonusResult;
  game.state = 'complete';
  $('cTitle').textContent = r.reachedTop ? 'Вылетел из бутылки!' : 'Бонус-раунд окончен';
  $('cStats').innerHTML =
    `<tr><td>Искры в бутылке</td><td>${r.got} / ${r.total}</td></tr>` +
    `<tr><td>Очки за искры</td><td>+${r.got * 100}</td></tr>` +
    (r.reachedTop ? `<tr><td>Добрался до горлышка</td><td>+5000 и 1UP</td></tr>` : '') +
    `<tr class="total"><td>Счёт</td><td>${game.score}</td></tr>`;
  const last = game.levelIdx >= LEVELS.length - 1;
  $('btnNext').textContent = last ? 'Финал ▶' : `Уровень ${game.levelIdx + 2}: ${LEVELS[game.levelIdx + 1].name} ▶`;
  $('btnNext').onclick = () => { Sound.play('select'); if (last) victory(); else startLevel(game.levelIdx + 1); };
  showScreen('complete');
  Sound.playSong('title');
}

function saveBest() {
  const isNew = game.score > game.best;
  if (isNew) { game.best = game.score; store.set('best', game.best); }
  return isNew;
}
function fillOver(title, textStr) {
  const isNew = saveBest();
  $('oTitle').textContent = title;
  $('oText').textContent = textStr;
  $('oStats').innerHTML = `<tr><td>Счёт</td><td>${game.score}</td></tr>` +
    `<tr><td>Всего искр</td><td>${game.totalSparks}</td></tr>` +
    `<tr><td${isNew ? ' class="new"' : ''}>${isNew ? 'Новый рекорд!' : 'Рекорд'}</td><td${isNew ? ' class="new"' : ''}>${game.best}</td></tr>`;
}
function gameOver() {
  game.state = 'gameover';
  fillOver('Game Over', 'Пузырь выдохся... Но друг всё ещё ждёт!');
  Sound.stopSong(); Sound.play('gameover');
  showScreen('over');
}
function victory() {
  game.state = 'victory'; world = null; game.celebT = 0;
  fillOver('Победа!', 'Все друзья на свободе. Пузырь — самый крутой!');
  showScreen('over');
  Sound.playSong('bonus'); Sound.play('fanfare');
}

function togglePause(force) {
  if (game.state !== 'play' && game.state !== 'bonus') return;
  const p = force != null ? force : !game.paused;
  if (p === game.paused) return;
  game.paused = p;
  Sound.pauseMusic(p);
  if (p) { $('btnSound').textContent = Sound.muted ? 'Звук: выкл' : 'Звук: вкл'; showScreen('pause'); }
  else showScreen(null);
}
function toggleMute() {
  Sound.init();
  Sound.setMuted(!Sound.muted);
  updateMuteIcon();
  $('btnSound').textContent = Sound.muted ? 'Звук: выкл' : 'Звук: вкл';
}
function updateMuteIcon() {
  $('btnMute').innerHTML = Sound.muted
    ? '<svg viewBox="0 0 24 24"><path d="M4 9h4l5-4v14l-5-4H4z" fill="#fff"/><path d="M16 9l5 6M21 9l-5 6" stroke="#ff6b6b" stroke-width="2.4" stroke-linecap="round"/></svg>'
    : '<svg viewBox="0 0 24 24"><path d="M4 9h4l5-4v14l-5-4H4z" fill="#fff"/><path d="M16 8.5a5 5 0 0 1 0 7M18.5 6a8.5 8.5 0 0 1 0 12" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round"/></svg>';
}

function checkOrientation() {
  const portrait = isTouch && innerHeight > innerWidth;
  $('rotate').classList.toggle('on', portrait);
  if (portrait) togglePause(true);
}

// кнопки
$('btnPlay').onclick = () => {
  startGame();
  try {   // полноэкранный режим и альбомная ориентация там, где это поддерживается (Android)
    const de = document.documentElement;
    if (isTouch && de.requestFullscreen && !document.fullscreenElement)
      de.requestFullscreen({ navigationUI: 'hide' }).then(() => screen.orientation && screen.orientation.lock && screen.orientation.lock('landscape').catch(() => { })).catch(() => { });
  } catch (e) { }
};
$('btnResume').onclick = () => { Sound.play('select'); togglePause(false); };
$('btnSound').onclick = () => toggleMute();
$('btnMenu').onclick = () => { Sound.play('select'); saveBest(); showTitle(); };
$('btnAgain').onclick = () => startGame();
$('btnOverMenu').onclick = () => { Sound.play('select'); showTitle(); };
const tapBtn = (el, fn) => {
  el.addEventListener('pointerdown', e => { e.preventDefault(); e.stopPropagation(); Sound.init(); fn(); });
  el.addEventListener('touchstart', e => e.stopPropagation(), { passive: true });
};
tapBtn($('btnPause'), () => togglePause());
tapBtn($('btnMute'), () => toggleMute());
document.addEventListener('visibilitychange', () => { if (document.hidden) togglePause(true); });
['pointerdown', 'touchstart'].forEach(n => addEventListener(n, () => Sound.init(), { passive: true }));

// =====================================================================
// ИГРОВОЙ ЦИКЛ (фиксированный шаг + интерполяция)
// =====================================================================
let last = performance.now(), acc = 0;
function update(dt) {
  game.t += dt;
  if (game.state === 'title') { titleScene.t += dt; titleScene.x += dt * 25; return; }
  if (game.state === 'victory') { game.celebT += dt; return; }
  if (!world) return;
  if ((game.state === 'play' || game.state === 'bonus') && !game.paused) updateWorld(dt);
  else if (game.state === 'complete' || game.state === 'bonusresult') {   // фон за панелью продолжает жить
    world.t += dt; updateParticles(dt);
    if (world.won) { winDance(world.player, dt); world.player.t += dt; world.player.px = world.player.x; world.player.py = world.player.y; }
  }
}
function render(alpha) {
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.fillStyle = '#0b1a33'; ctx.fillRect(0, 0, cv.width, cv.height);
  ctx.setTransform(S, 0, 0, S, offX, offY);
  if (game.state === 'title') renderTitle();
  else if (game.state === 'victory') renderCelebrate(game.celebT);
  else if (world) renderWorld(world, (game.paused || game.state !== 'play' && game.state !== 'bonus') ? 1 : alpha);
}
function frame(now) {
  let dt = (now - last) / 1000; last = now;
  if (dt > 0.25) dt = 0.25;
  acc += dt;
  let n = 0;
  while (acc >= STEP && n < 6) { update(STEP); acc -= STEP; n++; }
  if (n >= 6) acc = 0;
  try { render(acc / STEP); } catch (e) { console.error(e); }
  requestAnimationFrame(frame);
}

// отладочный доступ (консоль)
window.FizzySpot = { game, get world() { return world; }, startLevel, startBonus, startGame, input };

resize();
updateMuteIcon();
showTitle();
requestAnimationFrame(frame);
</script>
