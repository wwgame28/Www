<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Fizzy Spot">
<meta name="theme-color" content="#0b1a33">
<title>Fizzy Spot</title>
<style>
  :root {
    --sat: env(safe-area-inset-top, 0px);
    --sar: env(safe-area-inset-right, 0px);
    --sab: env(safe-area-inset-bottom, 0px);
    --sal: env(safe-area-inset-left, 0px);
    --font: ui-rounded, "SF Pro Rounded", "Arial Rounded MT Bold", "Trebuchet MS", system-ui, sans-serif;
    --orange: #ff8a1f;
    --orange-dark: #b84d00;
    --ink: #10183a;
  }
  html, body {
    margin: 0; height: 100%; overflow: hidden; background: #0b1a33;
    touch-action: none; overscroll-behavior: none;
    -webkit-user-select: none; user-select: none;
    -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent;
    -webkit-text-size-adjust: 100%;
  }
  body { position: fixed; inset: 0; font-family: var(--font); color: #fff; }
  canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
  #safe { position: absolute; visibility: hidden; pointer-events: none;
    padding: var(--sat) var(--sar) var(--sab) var(--sal); }

  /* touch controls */
  #controls { position: absolute; inset: 0; z-index: 2; display: none; }
  #controls.on { display: block; }
  #stick { position: absolute; width: 136px; height: 136px; margin: -68px 0 0 -68px; border-radius: 50%;
    background: radial-gradient(circle, rgba(255,255,255,.10), rgba(255,255,255,.22));
    border: 3px solid rgba(255,255,255,.38); box-sizing: border-box; pointer-events: none; }
  #stick .arr { position: absolute; width: 0; height: 0; border: 9px solid transparent; opacity: .55; }
  #stick .u { left: 50%; top: 6px; margin-left: -9px; border-bottom-color: #fff; }
  #stick .d { left: 50%; bottom: 6px; margin-left: -9px; border-top-color: #fff; }
  #stick .l { top: 50%; left: 6px; margin-top: -9px; border-right-color: #fff; }
  #stick .r { top: 50%; right: 6px; margin-top: -9px; border-left-color: #fff; }
  #knob { position: absolute; left: 50%; top: 50%; width: 62px; height: 62px; margin: -31px 0 0 -31px; border-radius: 50%;
    background: radial-gradient(circle at 35% 30%, rgba(255,255,255,.75), rgba(255,255,255,.35));
    border: 3px solid rgba(255,255,255,.75); box-sizing: border-box; }
  .btn { position: absolute; border-radius: 50%; display: flex; align-items: center; justify-content: center;
    flex-direction: column; font: 900 13px var(--font); color: rgba(255,255,255,.95); letter-spacing: .5px;
    box-sizing: border-box; border: 3px solid rgba(255,255,255,.6); pointer-events: none;
    text-shadow: 0 1px 2px rgba(0,0,0,.45); transition: transform .05s; }
  .btn svg { width: 38%; height: 38%; margin-bottom: 1px; }
  .btn.down { transform: scale(.9); border-color: #fff; }
  #bJump { width: 96px; height: 96px; right: calc(var(--sar) + 22px); bottom: calc(var(--sab) + 24px);
    background: radial-gradient(circle at 40% 35%, rgba(120,235,140,.55), rgba(40,170,80,.38)); }
  #bJump.down { background: radial-gradient(circle at 40% 35%, rgba(150,255,170,.8), rgba(60,200,100,.6)); }
  #bFire { width: 84px; height: 84px; right: calc(var(--sar) + 132px); bottom: calc(var(--sab) + 70px);
    background: radial-gradient(circle at 40% 35%, rgba(255,190,90,.55), rgba(255,120,30,.38)); }
  #bFire.down { background: radial-gradient(circle at 40% 35%, rgba(255,215,130,.85), rgba(255,140,40,.65)); }

  /* top buttons */
  #top { position: absolute; z-index: 4; top: calc(var(--sat) + 8px); right: calc(var(--sar) + 8px); display: none; gap: 8px; }
  #top.on { display: flex; }
  .ib { width: 44px; height: 44px; border-radius: 14px; border: 2px solid rgba(255,255,255,.55);
    background: rgba(16,24,58,.45); display: flex; align-items: center; justify-content: center; cursor: pointer;
    padding: 0; color: #fff; touch-action: manipulation; }
  .ib svg { width: 22px; height: 22px; }

  /* screens */
  .screen { position: absolute; inset: 0; z-index: 5; display: none; flex-direction: column; align-items: center;
    justify-content: center; text-align: center; touch-action: manipulation; box-sizing: border-box;
    padding: calc(var(--sat) + 10px) calc(var(--sar) + 16px) calc(var(--sab) + 10px) calc(var(--sal) + 16px); }
  .screen.on { display: flex; }
  .dim { background: rgba(8,12,34,.55); }
  .panel { background: linear-gradient(180deg, rgba(36,52,120,.94), rgba(20,28,74,.94)); border: 4px solid #fff;
    border-radius: 24px; padding: 14px 26px 16px; box-shadow: 0 8px 0 rgba(0,0,0,.25), 0 0 40px rgba(0,0,0,.35);
    max-width: 92%; max-height: 100%; overflow: auto; box-sizing: border-box; animation: pop .35s cubic-bezier(.2,1.6,.4,1); }
  @keyframes pop { from { transform: scale(.6); opacity: 0; } to { transform: scale(1); opacity: 1; } }
  .panel h1 { margin: 0 0 6px; font-size: clamp(24px, 6.5vh, 40px); font-weight: 900; color: #ffd34d;
    text-shadow: 0 3px 0 #b84d00, 0 0 18px rgba(255,180,60,.5); letter-spacing: 1px; }
  .panel p { margin: 4px 0; font-size: clamp(13px, 3.8vh, 18px); font-weight: 700; color: #dfe6ff; }
  .stats { margin: 6px auto 8px; border-collapse: collapse; font-size: clamp(13px, 3.9vh, 18px); font-weight: 800; }
  .stats td { padding: 2px 10px; text-align: left; }
  .stats td:last-child { text-align: right; color: #ffd34d; }
  .stats tr.total td { border-top: 2px solid rgba(255,255,255,.3); padding-top: 5px; color: #fff; }
  .stats tr.total td:last-child { color: #7dff9a; }
  .row { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; margin-top: 8px; }
  .b { font: 900 clamp(16px, 4.6vh, 22px) var(--font); color: #fff; border: none; border-radius: 16px; cursor: pointer;
    padding: 11px 26px 12px; background: linear-gradient(180deg, #ffb347, #ff7a1a); box-shadow: 0 5px 0 #b84d00;
    text-shadow: 0 2px 0 rgba(0,0,0,.25); touch-action: manipulation; min-height: 48px; }
  .b:active { transform: translateY(3px); box-shadow: 0 2px 0 #b84d00; }
  .b.alt { background: linear-gradient(180deg, #6fc8ff, #2f8fd8); box-shadow: 0 5px 0 #1a5c96; }
  .b.alt:active { box-shadow: 0 2px 0 #1a5c96; }
  .new { color: #7dff9a !important; animation: blink .6s infinite alternate; }
  @keyframes blink { to { opacity: .45; } }

  #title { justify-content: flex-end; padding-bottom: calc(var(--sab) + 4vh); }
  #title .b { font-size: clamp(20px, 6vh, 28px); padding: 12px 44px 13px; }
  #title .hint { margin-top: 10px; font-size: clamp(11px, 3.2vh, 14px); font-weight: 700; color: #fff;
    text-shadow: 0 1px 3px rgba(0,0,0,.6); opacity: .92; }
  #title .best { font-size: clamp(13px, 3.6vh, 16px); font-weight: 900; color: #fff; margin-bottom: 8px;
    text-shadow: 0 2px 3px rgba(0,0,0,.6); }

  #rotate { z-index: 20; background: #0b1a33; }
  #rotate .phone { width: 64px; height: 108px; border: 5px solid #fff; border-radius: 14px; position: relative;
    animation: rot 2s ease-in-out infinite; margin-bottom: 28px; }
  #rotate .phone::after { content: ""; position: absolute; left: 50%; bottom: 6px; width: 14px; height: 4px;
    margin-left: -7px; border-radius: 3px; background: #fff; }
  @keyframes rot { 0%, 25% { transform: rotate(0); } 55%, 100% { transform: rotate(-90deg); } }
  #rotate p { font-size: 20px; font-weight: 900; margin: 0 30px; }
</style>
</head>
<body>
<canvas id="cv"></canvas>
<div id="safe"></div>

<div id="controls">
  <div id="stick"><span class="arr u"></span><span class="arr d"></span><span class="arr l"></span><span class="arr r"></span><div id="knob"></div></div>
  <div id="bFire" class="btn"><svg viewBox="0 0 24 24"><circle cx="8" cy="14" r="5" fill="none" stroke="#fff" stroke-width="2.5"/><circle cx="17" cy="7" r="3.5" fill="none" stroke="#fff" stroke-width="2.5"/></svg>ОГОНЬ</div>
  <div id="bJump" class="btn"><svg viewBox="0 0 24 24"><path d="M4 16 L12 6 L20 16" fill="none" stroke="#fff" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/></svg>ПРЫЖОК</div>
</div>

<div id="top">
  <button class="ib" id="btnMute" aria-label="Звук"></button>
  <button class="ib" id="btnPause" aria-label="Пауза"><svg viewBox="0 0 24 24"><rect x="5" y="4" width="5" height="16" rx="1.5" fill="#fff"/><rect x="14" y="4" width="5" height="16" rx="1.5" fill="#fff"/></svg></button>
</div>

<div id="title" class="screen">
  <div class="best" id="titleBest"></div>
  <button class="b" id="btnPlay">▶ Играть</button>
  <div class="hint" id="titleHint"></div>
</div>

<div id="pause" class="screen dim">
  <div class="panel">
    <h1>Пауза</h1>
    <div class="row"><button class="b" id="btnResume">Продолжить</button></div>
    <div class="row"><button class="b alt" id="btnSound">Звук</button><button class="b alt" id="btnMenu">В меню</button></div>
  </div>
</div>

<div id="complete" class="screen dim">
  <div class="panel">
    <h1 id="cTitle">Уровень пройден!</h1>
    <table class="stats" id="cStats"></table>
    <div class="row"><button class="b" id="btnNext">Дальше</button></div>
  </div>
</div>

<div id="over" class="screen dim">
  <div class="panel">
    <h1 id="oTitle">Game Over</h1>
    <p id="oText"></p>
    <table class="stats" id="oStats"></table>
    <div class="row"><button class="b" id="btnAgain">Ещё раз</button><button class="b alt" id="btnOverMenu">В меню</button></div>
  </div>
</div>

<div id="rotate" class="screen">
  <div class="phone"></div>
  <p>Поверните телефон горизонтально</p>
</div>

<script>
'use strict';
/* =====================================================================
   FIZZY SPOT — аркадный платформер. Canvas 2D + Web Audio, без ассетов.
   Структура: константы → утилиты → звук → ввод → уровни → мир/физика →
   враги → бонус-раунд → отрисовка → экраны → игровой цикл.
   ===================================================================== */

// ---------- Константы ----------
const T = 16;               // размер тайла (логические единицы)
const VH = 270;             // логическая высота экрана
const STEP = 1 / 60;        // фиксированный шаг симуляции
const RUN = 150, ACC = 1300, AIR_ACC = 950, FRIC = 1500;
const JUMP_V = 330, G_HOLD = 700, G_NORM = 1600, MAX_FALL = 520, HOLD_MAX = 0.3;
const SPRING_V = 800, CLIMB_V = 95, SHOT_V = 330;
const LEVEL_TIME = 120, NEED = 30, BONUS_TIME = 35, MAX_FIZZ = 5;
const FONT = 'ui-rounded, "SF Pro Rounded", "Arial Rounded MT Bold", "Trebuchet MS", system-ui, sans-serif';

// тайлы
const E = 0, SOL = 1, ONE = 2, ROPE = 3, WAT = 4, CRATE = 5, SPR = 6;
const isSolid = t => t === SOL || t === CRATE || t === SPR;

// ---------- Утилиты ----------
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const lerp = (a, b, t) => a + (b - a) * t;
const rnd = (a, b) => a + Math.random() * (b - a);
const pick = arr => arr[(Math.random() * arr.length) | 0];
const hash = (x, y) => { let h = (x * 374761393 + y * 668265263) | 0; h = (h ^ (h >>> 13)) * 1274126177; return ((h ^ (h >>> 16)) >>> 0) / 4294967296; };
const overlap = (a, b) => a.x < b.x + b.w && a.x + a.w > b.x && a.y < b.y + b.h && a.y + a.h > b.y;
const store = {
  get(k, d) { try { const v = localStorage.getItem('fizzyspot.' + k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem('fizzyspot.' + k, JSON.stringify(v)); } catch (e) { } }
};
const vibrate = ms => { try { if (navigator.vibrate) navigator.vibrate(ms); } catch (e) { } };
const fmtTime = s => { s = Math.max(0, Math.ceil(s)); return (s / 60 | 0) + ':' + String(s % 60).padStart(2, '0'); };

// =====================================================================
// ЗВУК: синтез эффектов и чиптюн-секвенсор на Web Audio
// =====================================================================
const Sound = (() => {
  let ac = null, master, music, sfx, noiseBuf, timer = null;
  let muted = store.get('muted', false);
  let song = null, songStep = 0, nextT = 0, musicOn = true;

  const NOTE = { C: 0, 'C#': 1, D: 2, 'D#': 3, E: 4, F: 5, 'F#': 6, G: 7, 'G#': 8, A: 9, 'A#': 10, B: 11 };
  const freq = n => { const m = /^([A-G]#?)(\d)$/.exec(n); return m ? 440 * Math.pow(2, (NOTE[m[1]] + 12 * (+m[2] + 1) - 69) / 12) : 0; };
  const seq = s => s.trim().split(/\s+/).filter(x => x !== '|');

  const SONGS = {
    beach: { bpm: 138, lt: 'square', bt: 'triangle',
      lead: seq('E5 . G5 E5 C5 . D5 E5 | F5 . A5 F5 D5 . E5 F5 | G5 . E5 C5 D5 . B4 G4 | C5 . E5 G5 C6 . . . | A5 . G5 . E5 . C5 . | D5 . E5 . G5 . . . | A5 . G5 . E5 . D5 C5 | D5 . . B4 C5 . . .'),
      bass: seq('C3 . G2 . C3 . G2 . | F2 . C3 . F2 . C3 . | G2 . D3 . G2 . D3 . | C3 . G2 . C3 . E3 . | F2 . C3 . F2 . C3 . | C3 . G2 . C3 . G2 . | F2 . C3 . F2 . A2 . | G2 . D3 . G2 . B2 .'),
      drum: seq('k h s h k k s h') },
    pier: { bpm: 116, lt: 'square', bt: 'triangle',
      lead: seq('A4 . C5 E5 D5 . C5 A4 | G4 . B4 D5 C5 . B4 G4 | F4 . A4 C5 B4 . A4 F4 | E4 . G#4 B4 E5 . . . | A4 . . E5 D5 C5 B4 A4 | G4 . . D5 C5 B4 A4 G4 | F4 . A4 C5 F5 . E5 D5 | E5 . D5 . B4 . G#4 .'),
      bass: seq('A2 . E3 . A2 . E3 . | G2 . D3 . G2 . D3 . | F2 . C3 . F2 . C3 . | E2 . B2 . E2 . G#2 . | A2 . E3 . A2 . E3 . | G2 . D3 . G2 . D3 . | F2 . C3 . F2 . C3 . | E2 . B2 . E2 . E3 .'),
      drum: seq('k . h s . k h s') },
    bath: { bpm: 150, lt: 'square', bt: 'triangle',
      lead: seq('F5 A5 C6 A5 F5 . C5 . | G5 A#5 D6 A#5 G5 . D5 . | A5 C6 F6 C6 A5 . F5 . | G5 . E5 . C5 . . . | F5 . F5 G5 A5 . F5 . | A#5 . A5 . G5 . . . | A5 . G5 . F5 . D5 . | E5 . G5 . F5 . . .'),
      bass: seq('F2 . C3 . F2 . C3 . | G2 . D3 . G2 . D3 . | F2 . C3 . A2 . C3 . | C3 . G2 . C3 . E3 . | F2 . C3 . F2 . C3 . | A#2 . F3 . A#2 . F3 . | F2 . C3 . D3 . A2 . | C3 . G2 . F2 . . .'),
      drum: seq('k h s h k h s s') },
    bonus: { bpm: 160, lt: 'square', bt: 'square',
      lead: seq('C5 E5 G5 C6 G5 E5 C5 E5 | A4 C5 E5 A5 E5 C5 A4 C5 | F4 A4 C5 F5 C5 A4 F4 A4 | G4 B4 D5 G5 D5 B4 G4 B4'),
      bass: seq('C3 . C3 . A2 . A2 . | A2 . A2 . A2 . E2 . | F2 . F2 . F2 . C3 . | G2 . G2 . G2 . D3 .'),
      drum: seq('k h k h s h k h') },
    title: { bpm: 126, lt: 'square', bt: 'triangle',
      lead: seq('C5 . . G4 C5 . E5 . | D5 . C5 . A4 . . . | B4 . . G4 B4 . D5 . | C5 . . . . . . . | C5 . . G4 C5 . E5 . | F5 . E5 . D5 . C5 . | D5 . . B4 G4 . B4 . | C5 . . . . . . .'),
      bass: seq('C3 . G2 . C3 . G2 . | F2 . C3 . F2 . C3 . | G2 . D3 . G2 . D3 . | C3 . G2 . C3 . G2 . | C3 . G2 . C3 . G2 . | F2 . C3 . F2 . C3 . | G2 . D3 . G2 . D3 . | C3 . G2 . C3 . . .'),
      drum: seq('k . h . s . h h') }
  };

  function init() {
    if (ac) { if (ac.state === 'suspended') ac.resume(); return; }
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return;
    try { ac = new AC(); } catch (e) { return; }
    master = ac.createGain(); master.gain.value = muted ? 0 : 0.85; master.connect(ac.destination);
    music = ac.createGain(); music.gain.value = 0.3; music.connect(master);
    sfx = ac.createGain(); sfx.gain.value = 0.6; sfx.connect(master);
    noiseBuf = ac.createBuffer(1, ac.sampleRate | 0, ac.sampleRate);
    const d = noiseBuf.getChannelData(0);
    for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
    timer = setInterval(schedule, 25);
    if (ac.state === 'suspended') ac.resume();
  }

  function osc(type, f0, f1, t, dur, vol, dest) {
    const o = ac.createOscillator(), g = ac.createGain();
    o.type = type; o.frequency.setValueAtTime(f0, t);
    if (f1 && f1 !== f0) o.frequency.exponentialRampToValueAtTime(f1, t + dur);
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(vol, t + 0.006);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g); g.connect(dest || sfx); o.start(t); o.stop(t + dur + 0.03);
  }
  function noise(t, dur, vol, ftype, fq, dest) {
    const s = ac.createBufferSource(), f = ac.createBiquadFilter(), g = ac.createGain();
    s.buffer = noiseBuf; f.type = ftype || 'bandpass'; f.frequency.value = fq || 2000;
    g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    s.connect(f); f.connect(g); g.connect(dest || sfx); s.start(t, Math.random() * 0.5); s.stop(t + dur + 0.02);
  }

  // --- эффекты ---
  const FX = {
    jump(t) { osc('square', 280, 620, t, 0.13, 0.12); },
    shoot(t) { noise(t, 0.09, 0.25, 'highpass', 3500); osc('sine', 900, 380, t, 0.08, 0.18); },
    spark(t, n) { const f = 1046 * Math.pow(2, Math.min(n, 12) / 12); osc('triangle', f, f, t, 0.07, 0.2); osc('square', f * 1.5, f * 1.5, t + 0.05, 0.09, 0.07); },
    hurt(t) { osc('sawtooth', 420, 110, t, 0.32, 0.18); noise(t, 0.2, 0.25, 'lowpass', 1200); },
    spring(t) { osc('triangle', 160, 720, t, 0.28, 0.3); osc('sine', 330, 990, t + 0.03, 0.22, 0.12); },
    hit(t) { osc('square', 240, 160, t, 0.06, 0.12); },
    kill(t) { noise(t, 0.18, 0.35, 'bandpass', 1500); osc('square', 700, 90, t, 0.16, 0.12); },
    bottle(t) { [523, 659, 784, 1047, 1319].forEach((f, i) => osc('triangle', f, f, t + i * 0.05, 0.12, 0.2)); noise(t, 0.3, 0.1, 'highpass', 5000); },
    oneup(t) { [784, 988, 1175, 1568, 1319, 1568].forEach((f, i) => osc('square', f, f, t + i * 0.07, 0.1, 0.1)); },
    check(t) { osc('triangle', 660, 660, t, 0.1, 0.22); osc('triangle', 990, 990, t + 0.1, 0.2, 0.22); },
    locked(t) { osc('square', 160, 140, t, 0.1, 0.13); osc('square', 140, 120, t + 0.13, 0.12, 0.13); },
    splash(t) { noise(t, 0.45, 0.4, 'lowpass', 900); osc('sine', 300, 80, t, 0.25, 0.15); },
    pop(t) { noise(t, 0.3, 0.45, 'bandpass', 2500); osc('sine', 700, 50, t, 0.5, 0.25); },
    tick(t) { osc('square', 1200, 1200, t, 0.03, 0.08); },
    land(t) { noise(t, 0.06, 0.12, 'lowpass', 600); },
    select(t) { osc('triangle', 660, 880, t, 0.07, 0.2); },
    eshot(t) { osc('sine', 500, 250, t, 0.12, 0.12); noise(t, 0.08, 0.1, 'lowpass', 1500); },
    snap(t) { noise(t, 0.05, 0.5, 'highpass', 2500); osc('square', 900, 200, t, 0.05, 0.15); },
    bubble(t) { osc('sine', 400, 1200, t, 0.08, 0.15); },
    fanfare(t) {
      const n = ['C5', 'E5', 'G5', 'C6', 'G5', 'C6', 'E6'], d = [.12, .12, .12, .25, .12, .12, .5]; let tt = t;
      n.forEach((x, i) => { osc('square', freq(x), freq(x), tt, d[i] + 0.05, 0.12); osc('triangle', freq(x) / 2, freq(x) / 2, tt, d[i] + 0.05, 0.2); tt += d[i]; });
    },
    gameover(t) { ['G4', 'E4', 'C4', 'G3'].forEach((x, i) => osc('triangle', freq(x), freq(x) * 0.98, t + i * 0.28, 0.32, 0.25)); },
    open(t) { [523, 659, 784, 1047].forEach((f, i) => osc('square', f, f, t + i * 0.06, 0.15, 0.1)); noise(t, 0.4, 0.15, 'highpass', 4000); }
  };
  function play(name, arg) {
    if (!ac || muted) return;
    try { FX[name] && FX[name](ac.currentTime + 0.005, arg); } catch (e) { }
  }

  // --- музыка ---
  function drum(k, t) {
    if (k === 'k') osc('sine', 150, 45, t, 0.13, 0.55, music);
    else if (k === 's') { noise(t, 0.12, 0.35, 'highpass', 1800, music); osc('triangle', 220, 160, t, 0.06, 0.2, music); }
    else if (k === 'h') noise(t, 0.035, 0.18, 'highpass', 7000, music);
  }
  function schedule() {
    if (!ac || !song || !musicOn) return;
    const sd = 60 / song.bpm / 2;
    if (nextT < ac.currentTime - 0.2) nextT = ac.currentTime + 0.05;
    while (nextT < ac.currentTime + 0.12) {
      const i = songStep;
      const ln = song.lead[i % song.lead.length], bn = song.bass[i % song.bass.length], dn = song.drum[i % song.drum.length];
      if (ln && ln !== '.') { let len = 1; while (song.lead[(i + len) % song.lead.length] === '.' && len < 4) len++; osc(song.lt, freq(ln), freq(ln), nextT, sd * len * 0.9, 0.09, music); }
      if (bn && bn !== '.') osc(song.bt, freq(bn), freq(bn), nextT, sd * 1.6, 0.22, music);
      if (dn && dn !== '.') drum(dn, nextT);
      nextT += sd; songStep++;
    }
  }
  function playSong(name) {
    if (song === SONGS[name] && musicOn) return;
    song = SONGS[name] || null; songStep = 0; musicOn = true;
    if (ac) nextT = ac.currentTime + 0.08;
  }
  function stopSong() { song = null; }
  function pauseMusic(p) { musicOn = !p; if (!p && ac) nextT = ac.currentTime + 0.05; }
  function setMuted(m) { muted = m; store.set('muted', m); if (master) master.gain.value = m ? 0 : 0.85; }
  return { init, play, playSong, stopSong, pauseMusic, setMuted, get muted() { return muted; } };
})();

const input = { left: 0, right: 0, up: 0, down: 0, jump: 0, fire: 0, jumpHit: false, fireHit: false };

const tc = { left: 0, right: 0, up: 0, down: 0, jump: 0, fire: 0 };
const KEYMAP = {
  ArrowLeft: 'left', KeyA: 'left', ArrowRight: 'right', KeyD: 'right', ArrowUp: 'up', KeyW: 'up',
  ArrowDown: 'down', KeyS: 'down', KeyZ: 'jump', KeyK: 'jump', Space: 'jump', KeyX: 'fire', KeyJ: 'fire', KeyC: 'fire'
};
const isTouch = ('ontouchstart' in window) || navigator.maxTouchPoints > 0;

function pollInput() {
  for (const k of ['left', 'right', 'up', 'down', 'jump', 'fire']) input[k] = kb[k] || tc[k] ? 1 : 0;
}

addEventListener('keydown', e => {
  Sound.init();
  const a = KEYMAP[e.code];
  if (a) {
    e.preventDefault();
    if (!e.repeat) {
      if (a === 'jump') input.jumpHit = true;
      if (a === 'fire') input.fireHit = true;
    }
    kb[a] = 1;
  }
  if (e.repeat) return;
  if (e.code === 'KeyP' || e.code === 'Escape') togglePause();
  if (e.code === 'KeyM') toggleMute();
  if (e.code === 'Enter' || ((e.code === 'KeyZ' || e.code === 'Space') && game.state !== 'play' && game.state !== 'bonus')) {
    const scr = document.querySelector('.screen.on:not(#rotate) .b');
    if (scr && game.menuReadyAt < performance.now()) { e.preventDefault(); scr.click(); }
  }
});
addEventListener('keyup', e => { const a = KEYMAP[e.code]; if (a) kb[a] = 0; });
addEventListener('blur', () => { for (const k in kb) kb[k] = 0; for (const k in tc) tc[k] = 0; });

const $ = id => document.getElementById(id);
const elControls = $('controls'), elStick = $('stick'), elKnob = $('knob'), elJump = $('bJump'), elFire = $('bFire');
let stickId = null, stickCX = 0, stickCY = 0, stickHome = { x: 0, y: 0 };
const btnTouch = new Map();   // touchId -> 'jump' | 'fire'
const safe = { t: 0, r: 0, b: 0, l: 0 };

function readSafe() {
  const cs = getComputedStyle($('safe'));
  safe.t = parseFloat(cs.paddingTop) || 0; safe.r = parseFloat(cs.paddingRight) || 0;
  safe.b = parseFloat(cs.paddingBottom) || 0; safe.l = parseFloat(cs.paddingLeft) || 0;
}
function placeStick(x, y) { stickCX = x; stickCY = y; elStick.style.left = x + 'px'; elStick.style.top = y + 'px'; }
function homeStick() {
  stickHome.x = safe.l + 28 + 68; stickHome.y = innerHeight - safe.b - 22 - 68;
  placeStick(stickHome.x, stickHome.y); elKnob.style.transform = '';
}
function setStick(x, y) {
  let dx = x - stickCX, dy = y - stickCY;
  const len = Math.hypot(dx, dy), max = 44;
  const kx = len > max ? dx / len * max : dx, ky = len > max ? dy / len * max : dy;
  elKnob.style.transform = `translate(${kx}px,${ky}px)`;
  const dz = 14;
  tc.left = tc.right = tc.up = tc.down = 0;
  if (len > dz) {
    const nx = dx / len, ny = dy / len;
    if (nx < -0.38) tc.left = 1; if (nx > 0.38) tc.right = 1;
    if (ny < -0.5) tc.up = 1; if (ny > 0.6) tc.down = 1;
  }
}
function buttonAt(x, y) {
  let best = null, bd = 1e9;
  for (const [name, el] of [['jump', elJump], ['fire', elFire]]) {
    const r = el.getBoundingClientRect();
    const cx = r.left + r.width / 2, cy = r.top + r.height / 2, rad = r.width / 2;
    const d = Math.hypot(x - cx, y - cy) / rad;

}
function refreshButtons() {
  const v = [...btnTouch.values()];

      setStick(x, y);

      const b = buttonAt(x, y);
      if (b) { btnTouch.set(t.identifier, b); pressButton(b); }

  e.preventDefault();
  for (const t of e.changedTouches) {
    if (t.identifier === stickId) setStick(t.clientX, t.clientY);
    else if (btnTouch.has(t.identifier)) {
      const old = btnTouch.get(t.identifier), b = buttonAt(t.clientX, t.clientY);
      if (b !== old) { btnTouch.set(t.identifier, b); if (b) pressButton(b); }
    }
  }
  refreshButtons();
}, { passive: false });

  e.preventDefault();

    btnTouch.delete(t.identifier);

}

function newWorld(theme, W, H) {
  return { theme, W, H, tiles: new Uint8Array(W * H), chars: [], runs: [], water: [], piles: [], decor: [],
    sparks: [], items: [], checks: [], enemies: [], shots: [], eshots: [], parts: [], pops: [], plats: [],
    springs: new Map(), cage: null, friend: null, spawn: { x: 32, y: 32 }, cam: { x: 0, y: 0, px: 0, py: 0, look: 0 },

function tileAt(tx, ty) {
  const w = world;
  if (tx < 0 || tx >= w.W) return SOL;
  if (ty < 0 || ty >= w.H) return E;
  return w.tiles[ty * w.W + tx];
}
const tileAtPx = (x, y) => tileAt(Math.floor(x / T), Math.floor(y / T));

function buildLevel(idx) {
  const def = LEVELS[idx], rows = def.map;
  const H = rows.length, W = Math.max(...rows.map(r => r.length));
  const w = newWorld(def.theme, W, H);
  w.def = def; w.idx = idx;
  for (let y = 0; y < H; y++) {
    w.chars[y] = [];
    for (let x = 0; x < W; x++) {
      const ch = rows[y][x] || '.';
      w.chars[y][x] = ch;
      const i = y * W + x, px = x * T, py = y * T;
      switch (ch) {
        case '#': w.tiles[i] = SOL; break;
        case 'x': w.tiles[i] = CRATE; break;
        case '=': case '_': w.tiles[i] = ONE; break;
        case '|': w.tiles[i] = ROPE; break;
        case 'w': w.tiles[i] = WAT; break;
        case 'S': w.tiles[i] = SPR; break;
        case '$': w.tiles[i] = ROPE;   // искра на канате
        case 'o': w.sparks.push({ x: px + 8, y: py + 8, taken: false, ph: Math.random() * 6 }); break;
        case 'B': w.items.push({ kind: 'bottle', x: px + 8, y: py + 8, taken: false }); break;
        case 'K': w.checks.push({ x: px + 8, y: py + T, active: false, t: 0 }); break;
        case 'P': w.spawn = { x: px + 1, y: py + T - 20 }; break;
        case 'C': w.cage = { x: px, y: py + T - 38, w: 34, h: 38, open: false, shake: 0, t: 0 }; break;
        case 'O': w.plats.push({ kind: 'bob', x: px + 8 - 22, y: py + 4, w: 44, h: 10, baseY: py + 4, ph: x * 0.7, dx: 0, dy: 0 }); break;
        case 'T': case 'L': case 'F': w.decor.push({ ch, x: px + 8, y: py + T }); break;
        case 'I': break;
        default:
          if (ENEMY[ch]) w.enemies.push(makeEnemy(ch, px + 8, py, py + T));
      }
    }
  }
  // группы для отрисовки: платформы, вода, сваи
  for (let y = 0; y < H; y++) {
    let x = 0;
    while (x < W) {
      const ch = w.chars[y][x];
      if (ch === '=' || ch === '_') {
        let x1 = x; while (x1 < W && w.chars[y][x1] === ch) x1++;
        w.runs.push({ ch, x0: x, x1, y, ground: groundBelow(w, (x + x1) / 2 | 0, y + 1), gl: groundBelow(w, x, y + 1), gr: groundBelow(w, x1 - 1, y + 1), col: (x * 7 + y) % 3 });
        x = x1;
      } else if (ch === 'w') {
        let x1 = x; while (x1 < W && w.chars[y][x1] === 'w') x1++;
        w.water.push({ x0: x, x1, y, top: y === 0 || w.chars[y - 1][x] !== 'w' });
        x = x1;
      } else x++;
    }
  }
  for (let x = 0; x < W; x++) {
    let y = 0;
    while (y < H) {
      if (w.chars[y][x] === 'I') { let y1 = y; while (y1 < H && w.chars[y1][x] === 'I') y1++; w.piles.push({ x, y0: y, y1 }); y = y1; }
      else y++;
    }
  }
  w.sparksTotal = w.sparks.length;
  w.player = makePlayer(w.spawn.x, w.spawn.y);
  snapCamera(w);
  return w;
}

function groundBelow(w, x, y) {
  for (let yy = y; yy < w.H; yy++) {
    const ch = w.chars[yy][x];
    if (ch === '#' || ch === 'x' || ch === 'w' || ch === '=' || ch === '_') return yy * T;
  }
  return w.H * T;
}

function makeEnemy(ch, cx, top, bottom) {
  const d = ENEMY[ch];
  const e = { ...d, ch, x: cx - d.w / 2, y: bottom - d.h, vx: 0, vy: 0, face: -1, t: Math.random() * 3, state: 'idle',
    hitT: 0, dead: false, onGround: false, cd: 1 + Math.random(), homeX: cx - d.w / 2, homeY: bottom - d.h, maxHp: d.hp };
  if (d.kind === 'bat') { e.y = top; e.homeY = top; e.state = 'hang'; }
  if (d.kind === 'gull') { e.y = top; e.homeY = top; e.state = 'patrol'; }
  if (d.kind === 'trap') e.state = 'armed';
  return e;
}

// =====================================================================
// ФИЗИКА И КОЛЛИЗИИ (AABB против тайловой карты, раздельно по осям)
// =====================================================================
function moveX(b, dx) {
  if (!dx) return false;
  b.x += dx;
  const y0 = Math.floor(b.y / T), y1 = Math.floor((b.y + b.h - 0.01) / T);
  if (dx > 0) {
    const tx = Math.floor((b.x + b.w - 0.001) / T);
    for (let ty = y0; ty <= y1; ty++) if (isSolid(tileAt(tx, ty))) { b.x = tx * T - b.w; return true; }
  } else {
    const tx = Math.floor(b.x / T);
    for (let ty = y0; ty <= y1; ty++) if (isSolid(tileAt(tx, ty))) { b.x = (tx + 1) * T; return true; }
  }
  return false;
}

function moveY(b, dy, ignoreOne) {
  b.onGround = false; b.landTile = E;
  if (!dy) return false;
  const prevBottom = b.y + b.h;
  b.y += dy;
  const x0 = Math.floor(b.x / T), x1 = Math.floor((b.x + b.w - 0.01) / T);
  if (dy > 0) {
    const ty = Math.floor((b.y + b.h - 0.001) / T), top = ty * T;
    let hit = false, spring = -1;
    for (let tx = x0; tx <= x1; tx++) {
      const t = tileAt(tx, ty);
      if (isSolid(t) || (t === ONE && !ignoreOne && prevBottom <= top + 1)) {
        hit = true;
        if (t === SPR) spring = tx;
        if (b.landTile === E || t === SOL || t === CRATE) b.landTile = t;
      }
    }
    if (hit) {
      b.y = top - b.h; b.vy = 0; b.onGround = true;
      if (spring >= 0) { b.landTile = SPR; b.springX = spring; b.springY = ty; }
      return true;
    }
  } else {
    const ty = Math.floor(b.y / T);
    for (let tx = x0; tx <= x1; tx++) if (isSolid(tileAt(tx, ty))) { b.y = (ty + 1) * T; b.vy = 0; return true; }
  }
  return false;
}

// приземление на движущиеся платформы (пузыри)
function landOnPlats(b, prevBottom) {
  if (b.vy < 0) return null;
  for (const p of world.plats) {
    if (p.dead) continue;
    if (b.x + b.w > p.x + 2 && b.x < p.x + p.w - 2 && prevBottom <= p.y + 3 && b.y + b.h >= p.y) {
      b.y = p.y - b.h; b.vy = 0; b.onGround = true; return p;
    }
  }
  return null;
}

const standable = (x, y) => { const t = tileAtPx(x, y); return isSolid(t) || t === ONE; };
const ropeAt = (x, y) => tileAtPx(x, y) === ROPE;

// =====================================================================
// ЧАСТИЦЫ, ВСПЛЫВАЮЩИЕ ОЧКИ, ЭФФЕКТЫ
// =====================================================================
function burst(x, y, n, colors, speed, opt = {}) {
  const P = world.parts;
  for (let i = 0; i < n && P.length < 500; i++) {
    const a = opt.angle != null ? opt.angle + rnd(-opt.spread, opt.spread) : Math.random() * Math.PI * 2;
    const s = speed * rnd(0.35, 1);
    P.push({ x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s + (opt.vy || 0), life: 0, max: rnd(0.35, 0.8) * (opt.life || 1),
      size: rnd(1, 2.6) * (opt.size || 1), col: pick(colors), g: opt.g != null ? opt.g : 300, type: opt.type || 'dot', rot: Math.random() * 6, vr: rnd(-10, 10) });
  }
}
function popText(x, y, text, col = '#fff', big = false) { world.pops.push({ x, y, text, col, t: 0, big }); }
function addScore(n, x, y) { game.score += n; if (x != null) popText(x, y, '+' + n); }
function shake(m) { world.shake = Math.max(world.shake, m); }
function flash(col, a) { world.flashCol = col; world.flash = Math.max(world.flash, a); }
function message(txt, dur = 2) { world.msg = txt; world.msgT = dur; }

// =====================================================================
// ИГРОК
// =====================================================================
function updatePlayer(dt) {
  const w = world, p = w.player;
  p.px = p.x; p.py = p.y; p.t += dt;
  if (p.dead) {
    p.deadT += dt;
    if (p.deadT > 1.5) afterDeath();
    return;
  }
  if (w.won) { winDance(p, dt); return; }

  p.inv = Math.max(0, p.inv - dt); p.hurtT = Math.max(0, p.hurtT - dt); p.coyote -= dt;
  p.jumpBuf -= dt; p.shootCD -= dt; p.shootT -= dt; p.climbCD -= dt; p.dropT -= dt; p.springT -= dt;
  p.sq = Math.max(0, p.sq - dt * 2.5);
  if (input.jumpHit) { p.jumpBuf = 0.13; input.jumpHit = false; }

  let dir = (input.right ? 1 : 0) - (input.left ? 1 : 0);
  if (p.hurtT > 0) dir = 0;
  const cx = p.x + p.w / 2;

  // --- канат ---
  if (!p.climb && p.climbCD <= 0 && p.hurtT <= 0) {
    if ((input.up || (input.down && !p.onGround)) && ropeAt(cx, p.y + 2)) startClimb(p);
    else if (p.onGround && input.down && ropeAt(cx, p.y + p.h + 6)) { startClimb(p); p.y += 6; }
  }

  if (p.climb) {
    if (dir) p.face = dir;
    p.vy = ((input.down ? 1 : 0) - (input.up ? 1 : 0)) * CLIMB_V; p.vx = 0;
    const oy = p.y;
    moveY(p, p.vy * dt, true);
    if (!ropeAt(cx, p.y + 2)) { if (p.vy < 0) p.y = oy; else p.climb = false; }
    if (p.onGround && p.vy > 0) p.climb = false;
    p.run += Math.abs(p.vy) * dt * 0.12;
    if (p.jumpBuf > 0) {
      p.climb = false; p.jumpBuf = 0; p.vy = -JUMP_V * 0.92; p.vx = dir * RUN * 0.8;
      p.jumpHeld = true; p.holdT = 0; p.climbCD = 0.3; Sound.play('jump');
    }
  } else {
    // --- горизонталь ---
    const acc = p.onGround ? ACC : AIR_ACC;
    if (dir) {
      p.vx += dir * acc * dt;
      if (Math.sign(p.vx) !== dir) p.vx += dir * acc * dt;  // быстрый разворот
      p.vx = clamp(p.vx, -RUN, RUN);
      p.face = dir;
    } else {
      const f = (p.onGround ? FRIC : 350) * dt;
      p.vx = Math.abs(p.vx) <= f ? 0 : p.vx - Math.sign(p.vx) * f;
    }
    // --- прыжок (с запасом «койота» и буфером нажатия) ---
    if (p.jumpBuf > 0 && (p.onGround || p.coyote > 0)) {
      p.jumpBuf = 0;
      if (input.down && p.onGround && p.landTile === ONE) { p.dropT = 0.25; p.y += 2; }
      else {
        p.vy = -JUMP_V; p.onGround = false; p.coyote = 0; p.jumpHeld = true; p.holdT = 0; p.onPlat = null;
        Sound.play('jump'); burst(cx, p.y + p.h, 5, ['#fff', '#f2e3c0'], 50, { g: 0, life: 0.6 });
      }
    }
    if (p.jumpHeld) { p.holdT += dt; if (!input.jump || p.holdT > HOLD_MAX || p.vy >= 0) p.jumpHeld = false; }
    const g = p.jumpHeld && p.vy < 0 ? G_HOLD : G_NORM;
    p.vy = Math.min(p.vy + g * dt, MAX_FALL);

    // перенос движущейся платформой
    if (p.onPlat) {
      if (p.onPlat.dead) p.onPlat = null;
      else { p.x += p.onPlat.dx; p.y += p.onPlat.dy; }
    }
    moveX(p, p.vx * dt);
    const was = p.onGround, vyB = p.vy, prevBottom = p.y + p.h;
    moveY(p, p.vy * dt, p.dropT > 0);
    if (!p.onGround) { const pl = landOnPlats(p, prevBottom); p.onPlat = pl; if (pl && pl.kind === 'rise' && !pl.ridden) { pl.ridden = true; pl.popT = 1.5; } }
    else p.onPlat = null;

    if (p.onGround) {
      p.coyote = 0.1;
      if (!was && vyB > 180) { p.sq = 0.35; Sound.play('land'); burst(cx, p.y + p.h, 6, ['#fff', '#f2e3c0'], 60, { g: 0, life: 0.5, angle: -Math.PI / 2, spread: 1.4 }); }
      if (p.landTile === SPR) {
        p.vy = -SPRING_V; p.onGround = false; p.jumpHeld = false; p.springT = 0.7; p.onPlat = null;
        w.springs.set(p.springY * w.W + p.springX, 0.4);
        Sound.play('spring'); shake(2); vibrate(15);
      }
      if ((p.landTile === SOL || p.landTile === CRATE) && p.hurtT <= 0 && standable(p.x + 1, p.y + p.h + 2) && standable(p.x + p.w - 1, p.y + p.h + 2))
        p.lastSafe = { x: p.x, y: p.y };
    }
  }

  // --- выстрел пузырями ---
  if ((input.fireHit || input.fire) && p.shootCD <= 0 && p.hurtT <= 0 && w.shots.length < 6) {
    let ax = p.face, ay = 0;
    if (input.up && !p.climb) { ay = -1; ax = dir; }
    const l = Math.hypot(ax, ay); ax /= l; ay /= l;
    p.aimUp = ay < 0; p.aimDiag = ay < 0 && ax !== 0;
    const sx = cx + ax * 11, sy = p.y + 8 + ay * 12;
    w.shots.push({ x: sx, y: sy, vx: ax * SHOT_V + p.vx * 0.3, vy: ay * SHOT_V, life: 0.55, r: 4, t: 0 });
    p.shootCD = 0.21; p.shootT = 0.16;
    Sound.play('shoot');
    burst(sx, sy, 4, ['#fff', '#ffe9b8', '#bdf'], 60, { g: -50, life: 0.5, angle: Math.atan2(ay, ax), spread: 0.6 });
  }
  input.fireHit = false;

  // --- вода, падение ---
  if (tileAtPx(cx, p.y + p.h - 3) === WAT) {
    burst(cx, p.y + p.h, 18, ['#fff', '#bfefff', '#6fd3ff'], 160, { angle: -Math.PI / 2, spread: 0.9, g: 500 });
    Sound.play('splash');
    p.fizz -= 1; flash('#6fd3ff', 0.45); shake(5); vibrate(50);
    if (p.fizz <= 0) { killPlayer(); return; }
    p.x = p.lastSafe.x; p.y = p.lastSafe.y; p.px = p.x; p.py = p.y; p.vx = p.vy = 0; p.inv = 1.6; p.climb = false;
    message('Плюх! Газировка и вода не дружат', 1.5);
  }
  if (p.y > w.H * T + 40 && !w.bonus) { killPlayer(); return; }

  // --- анимационное состояние ---
  if (p.hurtT > 0) p.anim = 'hurt';
  else if (p.climb) p.anim = 'climb';
  else if (!p.onGround) p.anim = p.springT > 0 ? 'spring' : (p.vy < 0 ? 'jump' : 'fall');
  else if (Math.abs(p.vx) > 10) { p.anim = 'run'; p.run += Math.abs(p.vx) * dt * 0.09; }
  else p.anim = 'idle';
  if (p.anim === 'idle') {
    p.idleT += dt;
    if (p.idleT > 4 && p.twirl <= 0) { p.twirl = 1.2; p.idleT = 0; }
  } else { p.idleT = 0; p.twirl = 0; }
  if (p.twirl > 0) p.twirl -= dt;
}

function startClimb(p) {
  p.climb = true; p.vx = 0; p.vy = 0; p.jumpHeld = false; p.onPlat = null;
  p.x = Math.floor((p.x + p.w / 2) / T) * T + T / 2 - p.w / 2;
}

function hurtPlayer(srcX, dmg = 1) {
  const w = world, p = w.player;
  if (p.inv > 0 || p.dead || w.won) return;
  p.fizz -= dmg;
  shake(6); flash('#ff3b3b', 0.35); Sound.play('hurt'); vibrate(60);
  burst(p.x + p.w / 2, p.y + 8, 10, ['#ffb347', '#fff', '#ff7a1a'], 120);
  if (p.fizz <= 0) { killPlayer(); return; }
  p.inv = 1.6; p.hurtT = 0.35; p.climb = false; p.onPlat = null;
  p.vy = -220; p.vx = (p.x + p.w / 2 < srcX ? -1 : 1) * 140;
}

function killPlayer(reason) {
  const w = world, p = w.player;
  if (p.dead) return;
  p.dead = true; p.deadT = 0; p.fizz = 0; p.climb = false;
  const cx = p.x + p.w / 2, cy = p.y + 8;
  burst(cx, cy, 34, ['#ffb347', '#ff7a1a', '#fff', '#ffe08a'], 220, { g: 120, size: 1.4 });
  burst(cx, cy, 12, ['#fff'], 90, { type: 'bubble', g: -60, life: 1.6 });
  Sound.play('pop'); shake(10); flash('#fff', 0.5); vibrate([60, 40, 90]);
  if (reason === 'time') message('Время вышло!', 2);
}

function afterDeath() {
  const w = world;
  if (w.bonus) return;
  game.lives--;
  if (game.lives <= 0) { gameOver(); return; }
  const p = makePlayer(w.spawn.x, w.spawn.y);
  p.inv = 2;
  w.player = p; w.time = LEVEL_TIME; w.lastTick = 99; input.jumpHit = input.fireHit = false;
  for (const e of w.enemies) if (!e.dead && e.kind === 'bat') { e.state = 'hang'; e.x = e.homeX; e.y = e.homeY; }
  w.eshots.length = 0;
  snapCamera(w);
  message('Ещё попытка! Жизней: ' + game.lives, 1.8);
}

function winDance(p, dt) {
  p.anim = p.onGround ? 'win' : 'jump';
  p.vy = Math.min(p.vy + G_NORM * dt, MAX_FALL);
  const prev = p.y + p.h;
  moveY(p, p.vy * dt);
  if (!p.onGround && landOnPlats(p, prev)) p.onGround = true;
  if (p.onGround && Math.random() < 0.012) p.vy = -200;
}

// =====================================================================
// ВРАГИ
// =====================================================================
function walk(e, speed, dt) {
  e.vx = e.face * speed;
  e.vy = Math.min(e.vy + G_NORM * dt, MAX_FALL);
  if (moveX(e, e.vx * dt)) e.face *= -1;
  moveY(e, e.vy * dt);
  if (e.onGround) {
    const fx = e.face > 0 ? e.x + e.w + 1 : e.x - 1;
    if (!standable(fx, e.y + e.h + 2)) e.face *= -1;
  }
}

function updateEnemies(dt) {
  const w = world, p = w.player;
  const pcx = p.x + p.w / 2, pcy = p.y + p.h / 2;
  const camC = w.cam.x + VW / 2, range = VW * 0.75 + 80;
  for (const e of w.enemies) {
    if (e.dead) continue;
    if (Math.abs(e.x - camC) > range) continue;
    e.t += dt; e.hitT -= dt; e.cd -= dt;
    const ecx = e.x + e.w / 2, ecy = e.y + e.h / 2, dx = pcx - ecx, dy = pcy - ecy;
    switch (e.kind) {
      case 'crab': walk(e, 34, dt); break;
      case 'cray':
        if (e.state === 'snap') { e.vx = 0; if (e.cd <= 0) { e.state = 'walk'; e.cd = 2.5 + Math.random(); } e.vy = Math.min(e.vy + G_NORM * dt, MAX_FALL); moveY(e, e.vy * dt); }
        else { walk(e, 46, dt); if (e.cd <= 0) { e.state = 'snap'; e.cd = 0.8; if (Math.abs(dx) < 120) e.face = Math.sign(dx) || 1; } }
        break;
      case 'toy': {
        const ph = e.t % 4.2;
        if (ph < 3) walk(e, 62 * (1 - ph / 4), dt);
        else { e.vy = Math.min(e.vy + G_NORM * dt, MAX_FALL); moveY(e, e.vy * dt); }
        break;
      }
      case 'flea':
        e.vy = Math.min(e.vy + G_NORM * dt, MAX_FALL);
        if (moveX(e, e.vx * dt)) e.vx = -e.vx;
        moveY(e, e.vy * dt);
        if (e.onGround) {
          e.vx = 0;
          if (e.cd <= 0) {
            const near = Math.abs(dx) < 170 && Math.abs(dy) < 120;
            e.face = near ? (Math.sign(dx) || 1) : -e.face;
            e.vx = e.face * (near ? 95 : 40); e.vy = near ? -330 : -200; e.cd = rnd(0.7, 1.3);
            if (!standable(e.x + e.w / 2 + e.face * 40, e.y + e.h + 2)) e.vx *= 0.3;
          }
        }
        if (tileAtPx(ecx, e.y + e.h - 2) === WAT) { e.dead = true; burst(ecx, ecy, 10, ['#bfefff', '#fff'], 100); }
        break;
      case 'gull':
        if (e.state === 'patrol') {
          const nx = e.homeX + Math.sin(e.t * 0.7) * 80;
          e.face = nx > e.x ? 1 : -1; e.x = nx; e.y = e.homeY + Math.sin(e.t * 2.4) * 6;
          if (dy > 20 && dy < 170 && Math.abs(dx) < 60 && e.cd <= 0) {
            e.state = 'dive'; const l = Math.hypot(dx, dy); e.vx = dx / l * 175; e.vy = dy / l * 175; e.cd = 1.4;
          }
        } else if (e.state === 'dive') {
          e.x += e.vx * dt; e.y += e.vy * dt;
          if (e.cd <= 0.4 || isSolid(tileAtPx(ecx, e.y + e.h))) { e.state = 'back'; }
        } else {
          e.y -= 80 * dt; e.x += (e.homeX + Math.sin(e.t * 0.7) * 80 - e.x) * dt * 2;
          if (e.y <= e.homeY) { e.y = e.homeY; e.state = 'patrol'; e.cd = 2; }
        }
        break;
      case 'bat':
        if (e.state === 'hang') {
          if (Math.abs(dx) < 110 && dy > -10 && dy < 150) { e.state = 'fly'; e.cd = 3.2; }
        } else if (e.state === 'fly') {
          const l = Math.hypot(dx, dy) || 1;
          e.vx = lerp(e.vx, dx / l * 85, dt * 3); e.vy = lerp(e.vy, dy / l * 85, dt * 3);
          e.x += e.vx * dt; e.y += e.vy * dt + Math.sin(e.t * 9) * 0.6; e.face = e.vx > 0 ? 1 : -1;
          if (e.cd <= 0) e.state = 'back';
        } else {
          const hx = e.homeX - e.x, hy = e.homeY - e.y, l = Math.hypot(hx, hy);
          if (l < 3) { e.x = e.homeX; e.y = e.homeY; e.state = 'hang'; e.cd = 1.5; }
          else { e.x += hx / l * 90 * dt; e.y += hy / l * 90 * dt; e.face = hx > 0 ? 1 : -1; }
        }
        break;
      case 'trap':
        if (e.state === 'armed' && e.cd <= 0 && Math.abs(dx) < 30 && Math.abs(dy) < 24) { e.snap = 0.35; e.cd = 1.4; Sound.play('snap'); shake(2); }
        if (e.snap > 0) e.snap -= dt;
        break;
      case 'duck':
        e.face = dx > 0 ? 1 : -1;
        if (e.recoil > 0) e.recoil -= dt;
        if (e.cd <= 0 && Math.abs(dx) < 240 && Math.abs(dy) < 140) {
          e.cd = 2.3; e.recoil = 0.25;
          const vx = clamp(dx * 0.9, -170, 170);
          w.eshots.push({ x: ecx + e.face * 12, y: e.y + 6, vx: Math.abs(vx) < 60 ? e.face * 60 : vx, vy: -210 + Math.min(0, dy) * 0.8, r: 4, life: 3 });
          Sound.play('eshot');
        }
        break;
    }
    // контакт с игроком
    const harmful = !(e.kind === 'trap' && e.state !== 'armed');
    if (harmful && !p.dead && overlap({ x: e.x + 2, y: e.y + 2, w: e.w - 4, h: e.h - 2 }, p)) hurtPlayer(ecx);
  }
}

function damageEnemy(e, s) {
  const w = world;
  if (e.kind === 'trap' && e.state !== 'armed') return false;
  e.hp--; e.hitT = 0.12;
  if (e.kind !== 'trap' && e.kind !== 'duck' && !ENEMY[e.ch].fly) e.x += Math.sign(s.vx || 1) * 2;
  if (e.hp <= 0) {
    const cx = e.x + e.w / 2, cy = e.y + e.h / 2;
    if (e.kind === 'trap') { e.state = 'sprung'; }
    else { e.dead = true; }
    w.kills++;
    burst(cx, cy, 20, ['#fff', '#ffe08a', '#bdf', '#ffb347'], 160);
    burst(cx, cy, 6, ['#fff'], 60, { type: 'bubble', g: -80, life: 1.2 });
    addScore(e.score, cx, e.y - 4); Sound.play('kill'); shake(3);
  } else Sound.play('hit');
  return true;
}

// =====================================================================
// СНАРЯДЫ, ПРЕДМЕТЫ, ПЛАТФОРМЫ
// =====================================================================
function updateShots(dt) {
  const w = world, p = w.player;
  for (const s of w.shots) {
    s.t += dt; s.life -= dt;
    s.x += s.vx * dt; s.y += s.vy * dt + Math.sin(s.t * 30) * 0.3;
    let hit = s.life <= 0 || isSolid(tileAtPx(s.x, s.y));
    if (!hit) for (const e of w.enemies) {
      if (e.dead) continue;
      if (s.x > e.x - 3 && s.x < e.x + e.w + 3 && s.y > e.y - 3 && s.y < e.y + e.h + 3 && damageEnemy(e, s)) { hit = true; break; }
    }
    if (!hit) for (const q of w.eshots) {
      if (Math.hypot(q.x - s.x, q.y - s.y) < 8) { q.life = 0; hit = true; addScore(10, q.x, q.y); }
    }
    if (!hit && w.cage && !w.cage.open && s.x > w.cage.x && s.x < w.cage.x + w.cage.w && s.y > w.cage.y && s.y < w.cage.y + w.cage.h) { hit = true; tryCage(); }
    if (hit) { s.life = -1; burst(s.x, s.y, 6, ['#fff', '#cfefff'], 70, { g: 0, life: 0.5 }); }
  }
  w.shots = w.shots.filter(s => s.life > 0);
  for (const q of w.eshots) {
    q.life -= dt; q.vy += 520 * dt; q.x += q.vx * dt; q.y += q.vy * dt;
    if (isSolid(tileAtPx(q.x, q.y)) || tileAtPx(q.x, q.y) === WAT) { q.life = 0; burst(q.x, q.y, 6, ['#9fe0ff', '#fff'], 70); }
    else if (!p.dead && Math.abs(q.x - (p.x + p.w / 2)) < 9 && Math.abs(q.y - (p.y + 10)) < 11) { q.life = 0; hurtPlayer(q.x); }
  }
  w.eshots = w.eshots.filter(q => q.life > 0);
}

function updateItems(dt) {
  const w = world, p = w.player;
  if (p.dead) return;
  const box = { x: p.x - 5, y: p.y - 5, w: p.w + 10, h: p.h + 10 };
  w.comboT -= dt; if (w.comboT <= 0) w.combo = 0;
  for (const s of w.sparks) {
    if (s.taken) continue;
    if (s.x > box.x && s.x < box.x + box.w && s.y > box.y && s.y < box.y + box.h) collectSpark(s);
  }
  for (const it of w.items) {
    if (it.taken) continue;
    if (Math.abs(it.x - (p.x + p.w / 2)) < 13 && Math.abs(it.y - (p.y + 10)) < 16) {
      it.taken = true; p.fizz = MAX_FIZZ; addScore(500, it.x, it.y - 10);
      Sound.play('bottle'); flash('#ffd34d', 0.3); vibrate(20);
      burst(it.x, it.y, 22, ['#ffb347', '#fff', '#ffe08a'], 140, { g: -40 });
      burst(it.x, it.y, 10, ['#fff'], 70, { type: 'bubble', g: -90, life: 1.4 });
      message('Шипучесть восстановлена!', 1.3);
    }
  }
  for (const k of w.checks) {
    k.t += dt;
    if (!k.active && Math.abs(k.x - (p.x + p.w / 2)) < 14 && Math.abs(k.y - (p.y + p.h)) < 30) {
      k.active = true; w.spawn = { x: k.x - 7, y: k.y - 20 };
      Sound.play('check'); popText(k.x, k.y - 40, 'ЧЕКПОИНТ', '#7dff9a');
      burst(k.x, k.y - 30, 16, ['#7dff9a', '#fff', '#ffd34d'], 120, { type: 'confetti' });
    }
  }
  if (w.cage && !w.cage.open && overlap(p, w.cage)) tryCage();
}

function collectSpark(s) {
  const w = world;
  s.taken = true; w.sparksGot++; game.totalSparks++;
  w.combo++; w.comboT = 0.7;
  Sound.play('spark', w.combo);
  addScore(w.bonus ? 100 : 50, s.x, s.y - 6);
  burst(s.x, s.y, 12, ['#fff8c0', '#ffe066', '#fff', '#ffd0f0'], 110, { g: 60, type: 'star' });
  if (game.totalSparks % 100 === 0) {
    game.lives++; Sound.play('oneup'); popText(s.x, s.y - 26, '1UP!', '#7dff9a', true); flash('#7dff9a', 0.25);
  }
  if (!w.bonus && w.sparksGot === NEED) { message('Хватит искр! Клетка откроется — вперёд!', 2.5); Sound.play('check'); }
}

function tryCage() {
  const w = world, c = w.cage;
  if (c.open) return;
  if (w.sparksGot >= NEED) {
    c.open = true; w.won = true; w.wonT = 0;
    w.friend = { x: c.x + c.w / 2, y: c.y + c.h - 12, vy: -320, t: 0, onGround: false };
    Sound.stopSong(); Sound.play('open'); setTimeout(() => Sound.play('fanfare'), 250);
    burst(c.x + c.w / 2, c.y + 10, 50, ['#ff5fa2', '#ffd34d', '#5fd0ff', '#7dff9a', '#fff'], 230, { type: 'confetti', g: 160, life: 2.2 });
    flash('#fff', 0.5); shake(5); vibrate([30, 30, 30]);
    const p = w.player; p.vx = 0; p.climb = false; p.face = (c.x + c.w / 2) > p.x ? 1 : -1;
    addScore(1000, c.x + c.w / 2, c.y - 10);
  } else if (c.shake <= 0) {
    c.shake = 0.5; Sound.play('locked');
    message(`Клетка заперта! Нужно ещё ${NEED - w.sparksGot} искр`, 2);
  }
}

function updatePlats(dt) {
  for (const pl of world.plats) {
    pl.dx = 0; pl.dy = 0;
    if (pl.kind === 'bob') { const ny = pl.baseY + Math.sin(world.t * 1.5 + pl.ph) * 14; pl.dy = ny - pl.y; pl.y = ny; }
    else if (pl.kind === 'rise') {
      pl.dy = -pl.speed * dt; pl.y += pl.dy; pl.wob += dt;
      if (pl.ridden) { pl.popT -= dt; if (pl.popT <= 0) popBubble(pl); }
      if (!pl.dead && isSolid(tileAtPx(pl.x + pl.w / 2, pl.y - 6))) popBubble(pl);
    }
  }
}
function popBubble(pl) {
  if (pl.dead) return;
  pl.dead = true; Sound.play('bubble');
  burst(pl.x + pl.w / 2, pl.y + pl.r * 0.5, 16, ['#e8fbff', '#fff', '#bdf'], 120, { g: 0, life: 0.6 });
}

function updateParticles(dt) {
  const w = world;
  for (const q of w.parts) {
    q.life += dt; q.vy += q.g * dt; q.x += q.vx * dt; q.y += q.vy * dt; q.rot += q.vr * dt;
    if (q.type === 'confetti') { q.vx *= 0.98; q.vy = Math.min(q.vy, 90); }
  }
  w.parts = w.parts.filter(q => q.life < q.max);
  for (const t of w.pops) t.t += dt;
  w.pops = w.pops.filter(t => t.t < 1.1);
}

// =====================================================================
// КАМЕРА
// =====================================================================
let VW = 480;
function camTarget(w) {
  const p = w.player;
  const tx = p.x + p.w / 2 - VW / 2 + w.cam.look;
  const ty = p.y + p.h / 2 - VH * 0.56;
  return clampCam(w, tx, ty);
}
function clampCam(w, x, y) {
  const mw = w.W * T, mh = w.H * T;
  x = mw <= VW ? (mw - VW) / 2 : clamp(x, 0, mw - VW);
  y = mh <= VH ? (mh - VH) / 2 : clamp(y, 0, mh - VH);
  return { x, y };
}
function snapCamera(w) {
  if (w.bonus) { w.cam.x = (w.W * T - VW) / 2; w.cam.y = clamp(w.player.y - VH * 0.6, 0, w.H * T - VH); }
  else { w.cam.look = w.player.face * 40; const c = camTarget(w); w.cam.x = c.x; w.cam.y = c.y; }
  w.cam.px = w.cam.x; w.cam.py = w.cam.y;
}
function updateCamera(dt) {
  const w = world, c = w.cam, p = w.player;
  c.px = c.x; c.py = c.y;
  if (w.bonus) {
    c.x = (w.W * T - VW) / 2;
    const ty = p.y - VH * 0.55;
    if (ty < c.y) c.y = lerp(c.y, ty, Math.min(1, dt * 4));
    c.y = clamp(c.y, 0, w.H * T - VH);
    return;
  }
  if (!p.dead) c.look = lerp(c.look, p.face * 40 + p.vx * 0.15, Math.min(1, dt * 2.2));
  const t = camTarget(w);
  c.x = lerp(c.x, t.x, Math.min(1, dt * 7));
  const vyK = p.onGround || p.climb ? 4 : (p.y + p.h / 2 - c.y > VH * 0.75 || p.y - c.y < VH * 0.2 ? 8 : 2);
  c.y = lerp(c.y, t.y, Math.min(1, dt * vyK));
}

// =====================================================================
// ОБНОВЛЕНИЕ МИРА
// =====================================================================
function updateWorld(dt) {
  const w = world;
  w.t += dt;
  pollInput();
  if (w.introT > 0) w.introT -= dt;
  if (w.msgT > 0) w.msgT -= dt;
  w.shake = Math.max(0, w.shake - dt * 30);
  w.flash = Math.max(0, w.flash - dt * 1.8);
  for (const [k, v] of w.springs) { if (v - dt <= 0) w.springs.delete(k); else w.springs.set(k, v - dt); }
  if (w.cage) { w.cage.t += dt; if (w.cage.shake > 0) w.cage.shake -= dt; }

  const p = w.player;
  if (!w.won && !p.dead) {
    w.time -= dt;
    if (!w.bonus && w.time <= 10 && Math.ceil(w.time) !== w.lastTick) { w.lastTick = Math.ceil(w.time); if (w.time > 0) Sound.play('tick'); }
    if (w.time <= 0) {
      w.time = 0;
      if (w.bonus) { endBonus(false); return; }
      killPlayer('time');
    }
  }
  updatePlats(dt);
  updatePlayer(dt);
  if (world !== w) return;
  updateEnemies(dt);
  updateShots(dt);
  updateItems(dt);
  updateParticles(dt);
  if (w.bonus) updateBonus(dt);
  if (world !== w) return;
  updateCamera(dt);

  if (w.won) {
    w.wonT += dt;
    const f = w.friend;
    if (f) {
      f.t += dt; f.vy = Math.min(f.vy + G_NORM * dt, MAX_FALL);
      const fb = { x: f.x - 7, y: f.y - 8, w: 14, h: 20, vy: f.vy };
      moveY(fb, f.vy * dt); f.y = fb.y + 8; f.vy = fb.vy; f.onGround = fb.onGround;
      if (fb.onGround && Math.random() < 0.02) f.vy = -230;
    }
    if (w.wonT > 1 && Math.random() < 0.15) burst(w.player.x + rnd(-80, 80), w.cam.y - 5, 1, ['#ff5fa2', '#ffd34d', '#5fd0ff', '#7dff9a'], 30, { type: 'confetti', g: 60, life: 4 });
    if (w.wonT > 4 && game.state === 'play') showComplete();
  }
}

// =====================================================================
// БОНУС-РАУНД: внутри бутылки, прыжки по поднимающимся пузырям
// =====================================================================
function buildBonus() {
  const W = 40, H = 150, O = 9;    // O — сдвиг, чтобы бутылка была по центру экрана
  const w = newWorld('bottle', W, H);
  w.bonus = true; w.time = BONUS_TIME; w.introT = 2.5;
  const inner = y => {           // внутренние границы бутылки по строке
    if (y < 15) return [O + 8, O + 13];
    if (y < 23) { const k = (y - 15) / 8; return [O + Math.round(8 - 6 * k), O + Math.round(13 + 6 * k)]; }
    return [O + 2, O + 19];
  };
  w.inner = inner;
  for (let y = 0; y < H; y++) {
    w.chars[y] = [];
    const [a, b] = inner(y);
    for (let x = 0; x < W; x++) {
      const s = x < a || x > b || y >= H - 3;
      w.tiles[y * W + x] = s ? SOL : E; w.chars[y][x] = s ? '#' : '.';
    }
  }
  // ступеньки в горлышке
  for (let [x0, x1, y] of [[4, 7, 21], [13, 16, 19], [9, 11, 16], [11, 13, 13], [8, 10, 10], [11, 13, 7], [9, 11, 4]]) {
    x0 += O; x1 += O;
    for (let x = x0; x <= x1; x++) { w.tiles[y * W + x] = ONE; w.chars[y][x] = '='; }
    w.runs.push({ ch: '=', x0, x1: x1 + 1, y, ground: H * T, col: 0 });
  }
  for (let i = 0; i < 46; i++) {
    const y = 26 + Math.floor((i / 46) * (H - 34)) + Math.floor(Math.random() * 2);
    const [a, b] = inner(y);
    w.sparks.push({ x: (a + 1 + Math.random() * (b - a - 1)) * T, y: y * T + 8, taken: false, ph: Math.random() * 6 });
  }
  for (const y of [5, 8, 12, 18]) w.sparks.push({ x: (O + 11) * T, y: y * T, taken: false, ph: 0 });
  w.sparksTotal = w.sparks.length;
  w.player = makePlayer((O + 10.5) * T, (H - 3) * T - 20);
  w.bx0 = (O + 3) * T; w.bx1 = (O + 19) * T; w.floorY = (H - 3) * T;
  w.spawnT = 0;
  snapCamera(w);
  for (let i = 0; i < 9; i++) spawnBubble(w, w.cam.y + 40 + i * 28);
  return w;
}
function spawnBubble(w, y) {
  const r = rnd(18, 26);
  const x = rnd(w.bx0 + r, w.bx1 - r);
  y = Math.min(y, w.floorY - 2);
  w.plats.push({ kind: 'rise', x: x - r * 0.85, y, w: r * 1.7, h: 10, r, speed: rnd(32, 62), wob: Math.random() * 6, ridden: false, popT: 0, dx: 0, dy: 0 });
}
function updateBonus(dt) {
  const w = world, p = w.player;
  w.spawnT -= dt;
  if (w.spawnT <= 0) { w.spawnT = rnd(0.35, 0.6); spawnBubble(w, w.cam.y + VH + 30); }
  w.plats = w.plats.filter(pl => !pl.dead && pl.y > w.cam.y - 60);
  if (Math.random() < 0.3) burst(rnd(w.bx0, w.bx1), w.cam.y + VH + 4, 1, ['rgba(255,255,255,.6)'], 10, { type: 'bubble', g: -120, life: 3 });
  if (p.y + p.h > w.cam.y + VH + 30 && !p.dead) endBonus(false);
  else if (p.y < 3 * T) endBonus(true);
}
function endBonus(reachedTop) {
  const w = world;
  if (game.state !== 'bonus') return;
  game.state = 'bonusresult';
  const got = w.sparksGot;
  let pts = got * 100;
  if (reachedTop) { pts += 5000; game.lives++; Sound.play('oneup'); }
  else Sound.play('fanfare');
  game.score += reachedTop ? 5000 : 0;
  game.bonusResult = { got, total: w.sparksTotal, reachedTop, pts };
  Sound.stopSong();
  setTimeout(showBonusResult, 600);
}

// =====================================================================
// ОТРИСОВКА
// =====================================================================
const cv = $('cv');
const ctx = cv.getContext('2d');
let S = 1, offX = 0, offY = 0, dpr = 1;
const sprites = new Map();
function sprite(key, w, h, draw) {
  let s = sprites.get(key);
  if (!s) {
    s = document.createElement('canvas');
    s.width = Math.max(1, Math.ceil(w * S)); s.height = Math.max(1, Math.ceil(h * S));
    const c = s.getContext('2d'); c.scale(s.width / w, s.height / h); draw(c);
    sprites.set(key, s);
  }
  return s;
}
function rrect(c, x, y, w, h, r) {
  r = Math.min(r, w / 2, h / 2);
  c.beginPath(); c.moveTo(x + r, y); c.arcTo(x + w, y, x + w, y + h, r); c.arcTo(x + w, y + h, x, y + h, r);
  c.arcTo(x, y + h, x, y, r); c.arcTo(x, y, x + w, y, r); c.closePath();
}
function circle(c, x, y, r, fill) { c.beginPath(); c.arc(x, y, r, 0, Math.PI * 2); if (fill) { c.fillStyle = fill; c.fill(); } }
function text(c, str, x, y, size, fill, align = 'center', stroke = '#10183a', lw) {
  c.font = `900 ${size}px ${FONT}`; c.textAlign = align; c.textBaseline = 'middle';
  if (stroke) { c.lineJoin = 'round'; c.lineWidth = lw || size * 0.28; c.strokeStyle = stroke; c.strokeText(str, x, y); }
  c.fillStyle = fill; c.fillText(str, x, y);
}

function resize() {
  readSafe();
  dpr = Math.min(window.devicePixelRatio || 1, 2.5);
  const cw = innerWidth, ch = innerHeight;
  cv.width = Math.round(cw * dpr); cv.height = Math.round(ch * dpr);
  VW = clamp(cw / ch * VH, 400, 620);
  S = Math.min(cv.width / VW, cv.height / VH);
  offX = Math.round((cv.width - VW * S) / 2); offY = Math.round((cv.height - VH * S) / 2);
  sprites.clear(); grads.clear();
  homeStick();
  checkOrientation();
}
addEventListener('resize', resize);
addEventListener('orientationchange', () => setTimeout(resize, 120));

// безопасные границы HUD в логических единицах
function hudBounds() {
  const k = dpr / S;
  const l = Math.max(6, (safe.l + 8) * dpr / S - offX / S);
  const r = Math.min(VW - 6, ((innerWidth - safe.r - 8 - 100) * dpr - offX) / S);
  const t = Math.max(5, (safe.t + 6) * dpr / S - offY / S);
  return { l, r, t, k };
}

// ---------- кэш градиентов ----------
const grads = new Map();
function grad(key, make) { let g = grads.get(key); if (!g) { g = make(); grads.set(key, g); } return g; }
function vgrad(stops, y0, y1) { const g = ctx.createLinearGradient(0, y0, 0, y1); stops.forEach((s, i) => g.addColorStop(i / (stops.length - 1), s)); return g; }

// ---------- фоны с параллаксом ----------
function drawBackground(w, camX, camY) {
  const th = w.theme, t = w.t;
  const vy = (w.H * T - VH) - camY;          // насколько камера поднялась
  if (th === 'beach') drawBeachBG(camX, vy, t);
  else if (th === 'pier') drawPierBG(camX, vy, t);
  else if (th === 'bath') drawBathBG(camX, vy, t);
  else drawBottleBG(camX, camY, t);
}
const wrap = (v, m) => ((v % m) + m) % m;

function cloud(c, x, y, s) {
  c.beginPath();
  c.arc(x, y, 12 * s, 0, 7); c.arc(x + 14 * s, y - 7 * s, 14 * s, 0, 7); c.arc(x + 30 * s, y - 2 * s, 11 * s, 0, 7);
  c.arc(x + 18 * s, y + 4 * s, 12 * s, 0, 7); c.fill();
}
function palm(c, x, y, h, col, leaf) {
  c.strokeStyle = col; c.lineWidth = 5; c.lineCap = 'round';
  c.beginPath(); c.moveTo(x, y); c.quadraticCurveTo(x + 10, y - h * 0.5, x + 4, y - h); c.stroke();
  c.fillStyle = leaf;
  for (let i = 0; i < 6; i++) {
    const a = -Math.PI / 2 + (i - 2.5) * 0.55;
    c.save(); c.translate(x + 4, y - h); c.rotate(a);
    c.beginPath(); c.moveTo(0, 0); c.quadraticCurveTo(14, -8, 30, 6); c.quadraticCurveTo(14, -1, 0, 0); c.fill();
    c.restore();
  }
}

function drawBeachBG(camX, vy, t) {
  const c = ctx;
  c.fillStyle = grad('beach-sky', () => vgrad(['#36b2ff', '#7fd4ff', '#d3f4ff'], 0, VH)); c.fillRect(0, 0, VW, VH);
  // солнце
  const sx = VW * 0.8 - camX * 0.01, sy = 46 + vy * 0.03;
  c.fillStyle = 'rgba(255,250,200,.35)'; circle(c, sx, sy, 34 + Math.sin(t * 2) * 2); c.fill();
  circle(c, sx, sy, 22, '#fff6b0');
  // облака
  c.fillStyle = 'rgba(255,255,255,.92)';
  for (let i = 0; i < 6; i++) {
    const x = wrap(i * 190 - camX * 0.1 + t * 5, VW + 260) - 120;
    cloud(c, x, 28 + (i % 3) * 24 + vy * 0.08, 0.7 + (i % 2) * 0.35);
  }
  // море на горизонте
  const hy = 150 + vy * 0.22;
  c.fillStyle = grad('beach-sea', () => vgrad(['#1f9fd6', '#2fc0e8', '#7fe0f5'], 0, 120));
  c.save(); c.translate(0, hy); c.fillRect(0, 0, VW, VH); c.restore();
  // остров
  const ix = wrap(500 - camX * 0.2, 1300) - 200;
  c.fillStyle = '#2f8f6a'; c.beginPath(); c.ellipse(ix, hy + 2, 70, 12, 0, Math.PI, 0); c.fill();
  palm(c, ix + 10, hy - 6, 34, '#7a5a3a', '#2f8f6a');
  // блики на воде
  c.fillStyle = 'rgba(255,255,255,.55)';
  for (let i = 0; i < 14; i++) {
    const x = wrap(i * 67 - camX * 0.25 + Math.sin(t + i) * 6, VW + 40) - 20;
    c.fillRect(x, hy + 8 + (i % 5) * 9, 10 + (i % 3) * 6, 1.5);
  }
  // дюны с пальмами
  const dy = 205 + vy * 0.45, off = camX * 0.45;
  c.fillStyle = '#f9e3a8';
  c.beginPath(); c.moveTo(0, VH);
  for (let x = 0; x <= VW + 10; x += 10) c.lineTo(x, dy + Math.sin((x + off) * 0.012) * 10 + Math.sin((x + off) * 0.031) * 4);
  c.lineTo(VW, VH); c.fill();
  for (let i = 0; i < 4; i++) {
    const x = wrap(i * 260 + 90 - off, VW + 300) - 120;
    palm(c, x, dy + Math.sin((x + off) * 0.012) * 10 + 4, 70, '#9b7046', '#3fae6a');
  }
}

function drawPierBG(camX, vy, t) {
  const c = ctx;

  const hy = 172 + vy * 0.2;

  circle(c, sx, hy - 6, 32, '#ffd27a');
  // звёзды
  c.fillStyle = 'rgba(255,255,255,.7)';

  // город и маяк

  c.fillStyle = '#3c2453';
  for (let i = 0; i < 30; i++) {
    const x = wrap(i * 41 - off, VW + 60) - 30, h = 14 + (hash(i, 3) * 30 | 0);
    c.fillRect(x, hy - h, 30, h);
  }
  const lx = wrap(700 - off, 1500) - 300;
  c.fillStyle = '#f2e6ff'; c.beginPath(); c.moveTo(lx - 8, hy); c.lineTo(lx - 5, hy - 60); c.lineTo(lx + 5, hy - 60); c.lineTo(lx + 8, hy); c.fill();
  c.fillStyle = '#e8506a'; c.fillRect(lx - 7, hy - 40, 14, 6); c.fillRect(lx - 6, hy - 22, 12, 6);
  circle(c, lx, hy - 64, 5, '#fff6b0');
  c.save(); c.translate(lx, hy - 64); c.rotate(t * 0.8);
  c.fillStyle = 'rgba(255,246,176,.18)'; c.beginPath(); c.moveTo(0, 0); c.lineTo(160, -14); c.lineTo(160, 14); c.fill();

  c.fillStyle = 'rgba(255,200,110,.6)';
  for (let i = 0; i < 12; i++) {
    const w = 30 - i * 2, y = hy + 4 + i * 6;
